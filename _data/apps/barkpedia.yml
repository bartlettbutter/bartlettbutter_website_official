# Per-app marketing data for Barkpedia. Consumed by
# _layouts/app-barkpedia.html via _includes/marketing/hero-gallery.html.
# The gallery is image-only, so it is defined once under `en` and every
# localized page falls back to that entry (mirrors _data/home.yml's keying by
# language code, which these files keep for when translatable data is added).
#
# Screenshots live in /assets/screenshots/barkpedia/ (660px-wide web copies of
# the App Store mockups).

en:
  hero_gallery:
    # No label/title: this strip is purely visual and shared across all
    # languages (see the layout's en fallback), so it carries no translatable
    # copy. `alt` is a generic, per-screen accessible description.
    alt: "Barkpedia app screen"
    shots:
      - /assets/screenshots/barkpedia/01-welcome.png
      - /assets/screenshots/barkpedia/02-identify.png
      - /assets/screenshots/barkpedia/03-profile.png
      - /assets/screenshots/barkpedia/04-favorites.png
      - /assets/screenshots/barkpedia/05-explore.png
      - /assets/screenshots/barkpedia/06-quiz.png
      - /assets/screenshots/barkpedia/07-trivia.png
