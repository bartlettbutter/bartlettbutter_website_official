      - image: /assets/screenshots/journeyfolio/01-welcome.png
        alt: "Journeyfolio का स्वागत स्क्रीन जो इसके मुख्य वादों को सूचीबद्ध करता है"
        title: "इसे खोलें और योजना बनाना शुरू करें"
        body: "कोई खाता नहीं, कोई साइन-अप नहीं, कोई सेटअप नहीं। पहले टैप से ही सब कुछ आपके डिवाइस पर रहता है, और चलते-फिरते यह सब ऑफ़लाइन काम करता है।"
      - image: /assets/screenshots/journeyfolio/02-glance.png
        alt: "यात्रा का अवलोकन जो मौसम, एक दिन चयनकर्ता और उड़ान कार्ड दिखाता है"
        title: "पूरी यात्रा एक नज़र में"
        body: "लाइव मौसम, एक दिन-प्रतिदिन चयनकर्ता और आपकी उड़ानें एक ही स्क्रीन पर साथ रहती हैं, ताकि खोलते ही आपकी यात्रा का स्वरूप स्पष्ट हो जाए।"
      - image: /assets/screenshots/journeyfolio/03-daily.png
        alt: "होटल, परिवहन तथा स्थान और टिकट अनुभागों में समूहित यात्रा-कार्यक्रम"
        title: "दिन के अनुसार व्यवस्थित, प्रकार के अनुसार क्रमबद्ध"
        body: "उड़ानें, होटल, परिवहन, रेस्तरां, टिकट और नोट्स स्पष्ट श्रेणियों में समूहित और दिन-प्रतिदिन व्यवस्थित होते हैं, ताकि कुछ भी छूट न जाए।"
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "बहु-गंतव्य यात्रा जो सैन फ्रांसिस्को, लॉस एंजिल्स और लास वेगास को सूचीबद्ध करती है"
        title: "बहु-शहर यात्राएँ, सरल बनाई गईं"
        body: "कई शहरों को एक यात्रा में जोड़ रहे हैं? प्रत्येक गंतव्य को अपनी तारीखें, गतिविधियाँ, मौसम और स्थानीय विवरण मिलते हैं, सभी एक ही यात्रा के तहत।"
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "मौसम और गतिविधियों के साथ लास वेगास के लिए एकल-गंतव्य यात्रा-कार्यक्रम"
        title: "हर पड़ाव, अपना यात्रा-कार्यक्रम"
        body: "किसी भी गंतव्य में गहराई से जाएँ उसके पूर्वानुमान, दिन फ़िल्टर और पूरे कार्यक्रम के लिए — वही स्पष्ट दृश्य, चाहे वह आपका पहला शहर हो या पाँचवाँ।"
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "सत्यापित पते और एम्बेडेड मानचित्र के साथ गतिविधि संपादक"
        title: "ऐसे पते जिन पर आप भरोसा कर सकते हैं"
        body: "एक स्थान जोड़ें और Journeyfolio Apple Maps के विरुद्ध पते को सत्यापित करता है और इसे एम्बेडेड मानचित्र पर पिन करता है, ताकि पहुँचने पर वहाँ जाना एक टैप की दूरी पर हो।"
      - image: /assets/screenshots/journeyfolio/07-timelines.png
        alt: "किसी शो के लिए तारीख, पता, फ़ोन और मानचित्र के साथ गतिविधि विवरण स्क्रीन"
        title: "हर विवरण, ठीक वहीं जहाँ आपको चाहिए"
        body: "प्रत्येक गतिविधि अपना समय, स्थान, फ़ोन नंबर, मानचित्र और आपके अपने नोट्स एक साथ रखती है — पुष्टिकरण खोजने के लिए ईमेल खंगालने की ज़रूरत नहीं।"
      - image: /assets/screenshots/journeyfolio/08-flights.png
        alt: "सत्यापित मार्ग, समय और एयरलाइन दिखाने वाला उड़ान संपादक"
        title: "उड़ानें, सत्यापित और ट्रैक की गईं"
        body: "एक उड़ान संख्या दर्ज करें और Journeyfolio मार्ग, समय और एयरलाइन भर देता है, फिर प्रत्येक हवाई अड्डे के स्थानीय समय में इसकी लाइव स्थिति को आपके यात्रा-कार्यक्रम में बनाए रखता है।"

nl:
  showcase:
    label: "Een nadere blik"
    title: "Je hele reis, prachtig op orde"
    intro: "Ontdek hoe Journeyfolio verspreide boekingen, screenshots en e-mails omzet in één rustig, dag-voor-dag reisschema."
    shots:
      - image: /assets/screenshots/journeyfolio/01-welcome.png
        alt: "Journeyfolio-welkomstscherm met zijn belangrijkste beloften"
        title: "Open het en begin met plannen"
        body: "Geen account, geen aanmelding, geen installatie. Vanaf de eerste tik leeft alles op je apparaat, en het werkt allemaal offline wanneer je onderweg bent."
      - image: /assets/screenshots/journeyfolio/02-glance.png
        alt: "Reisoverzicht met het weer, een dagkiezer en vluchtkaarten"
        title: "De hele reis in één oogopslag"
        body: "Live weer, een dag-voor-dag kiezer en je vluchten staan samen op één scherm, zodat de vorm van je reis meteen duidelijk is zodra je het opent."
      - image: /assets/screenshots/journeyfolio/03-daily.png
        alt: "Reisschema gegroepeerd in de secties Hotel, Vervoer en Plaatsen en tickets"
        title: "Geordend per dag, gesorteerd op type"
        body: "Vluchten, hotels, vervoer, restaurants, tickets en notities worden in duidelijke categorieën gegroepeerd en dag voor dag geordend, zodat niets door de mazen glipt."
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "Reis met meerdere bestemmingen met San Francisco, Los Angeles en Las Vegas"
        title: "Reizen naar meerdere steden, eenvoudig gemaakt"
        body: "Rijg je meerdere steden aaneen tot één reis? Elke bestemming krijgt zijn eigen data, activiteiten, weer en lokale details, allemaal onder één reis."
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "Reisschema voor één bestemming voor Las Vegas met weer en activiteiten"
        title: "Elke stop, zijn eigen reisschema"
        body: "Duik in elke bestemming voor de verwachting, dagfilters en het volledige schema — dezelfde heldere weergave, of het nu je eerste stad is of je vijfde."
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "Activiteiteneditor met een geverifieerd adres en een ingesloten kaart"
        title: "Adressen die je kunt vertrouwen"
        body: "Voeg een plek toe en Journeyfolio verifieert het adres met Apple Maps en zet het op een ingesloten kaart, zodat je er bij aankomst met één tik naartoe gaat."
      - image: /assets/screenshots/journeyfolio/07-timelines.png
        alt: "Activiteitdetailscherm voor een show met datum, adres, telefoon en kaart"
        title: "Elk detail, precies waar je het nodig hebt"
        body: "Elke activiteit houdt zijn tijd, locatie, telefoonnummer, kaart en je eigen notities bij elkaar — geen gespit in e-mails om de bevestiging te vinden."
      - image: /assets/screenshots/journeyfolio/08-flights.png
        alt: "Vluchteditor met een geverifieerde route, tijden en luchtvaartmaatschappij"
        title: "Vluchten, geverifieerd en gevolgd"
        body: "Voer een vluchtnummer in en Journeyfolio vult de route, tijden en luchtvaartmaatschappij in, en houdt de live status in je reisschema bij in de lokale tijd van elke luchthaven."

tr:
  showcase:
    label: "Daha yakından bir bakış"
    title: "Tüm geziniz, güzelce düzenlenmiş"
    intro: "Journeyfolio'nun dağınık rezervasyonları, ekran görüntülerini ve e-postaları nasıl sakin, gün gün bir güzergâha dönüştürdüğünü görün."
    shots:
      - image: /assets/screenshots/journeyfolio/01-welcome.png
        alt: "Temel vaatlerini sıralayan Journeyfolio karşılama ekranı"
        title: "Açın ve planlamaya başlayın"
        body: "Hesap yok, kayıt yok, kurulum yok. İlk dokunuştan itibaren her şey cihazınızda bulunur ve yoldayken tamamen çevrimdışı çalışır."
      - image: /assets/screenshots/journeyfolio/02-glance.png
        alt: "Hava durumunu, bir gün seçiciyi ve uçuş kartlarını gösteren gezi genel görünümü"
        title: "Tüm yolculuk tek bakışta"
        body: "Canlı hava durumu, gün gün seçici ve uçuşlarınız tek bir ekranda bir arada durur; böylece gezinizin şekli açtığınız anda netleşir."
      - image: /assets/screenshots/journeyfolio/03-daily.png
        alt: "Otel, Ulaşım ve Yerler ve biletler bölümlerine gruplanmış güzergâh"
        title: "Güne göre düzenlenmiş, türe göre sıralanmış"
        body: "Uçuşlar, oteller, ulaşım, restoranlar, biletler ve notlar net kategorilere gruplanır ve gün gün düzenlenir; böylece hiçbir şey gözden kaçmaz."
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "San Francisco, Los Angeles ve Las Vegas'ı sıralayan çok hedefli gezi"
        title: "Çok şehirli geziler, basitleştirildi"
        body: "Birkaç şehri tek bir geziye mi bağlıyorsunuz? Her hedef kendi tarihlerine, etkinliklerine, hava durumuna ve yerel ayrıntılarına sahip olur; hepsi tek bir yolculuk altında."
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "Hava durumu ve etkinliklerle Las Vegas için tek hedefli güzergâh"
        title: "Her durak, kendi güzergâhı"
        body: "Herhangi bir hedefe tahminini, gün filtrelerini ve tam programını görmek için inin — ister ilk şehriniz ister beşincisi olsun, aynı net görünüm."
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "Doğrulanmış bir adres ve gömülü bir harita içeren etkinlik düzenleyici"
        title: "Güvenebileceğiniz adresler"
        body: "Bir yer ekleyin; Journeyfolio adresi Apple Maps ile doğrular ve gömülü bir haritada işaretler; böylece vardığınızda oraya gitmek tek bir dokunuş uzağınızda olur."
      - image: /assets/screenshots/journeyfolio/07-timelines.png
        alt: "Bir gösteri için tarih, adres, telefon ve harita içeren etkinlik ayrıntı ekranı"
        title: "Her ayrıntı, tam ihtiyacınız olan yerde"
        body: "Her etkinlik saatini, konumunu, telefon numarasını, haritasını ve kendi notlarınızı bir arada tutar — onayı bulmak için e-postaları karıştırmaya gerek yok."
      - image: /assets/screenshots/journeyfolio/08-flights.png
        alt: "Doğrulanmış bir rota, saatler ve havayolu gösteren uçuş düzenleyici"
        title: "Uçuşlar, doğrulanmış ve takip edilmiş"
        body: "Bir uçuş numarası girin; Journeyfolio rotayı, saatleri ve havayolunu doldurur, ardından canlı durumunu her havaalanının yerel saatinde güzergâhınızın içinde tutar."
