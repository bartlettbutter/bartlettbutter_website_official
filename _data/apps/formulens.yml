# Per-app marketing data for FormuLens. Consumed by
# _layouts/app-formulens.html via _includes/marketing/hero-gallery.html.
# The gallery is image-only, so it is defined once under `en` and every
# localized page falls back to that entry (mirrors _data/home.yml's keying by
# language code, which these files keep for when translatable data is added).
#
# Screenshots live in /assets/screenshots/formulens/ (660px-wide web copies of
# the App Store mockups).

en:
  hero_gallery:
    # No label/title: this strip is purely visual and shared across all
    # languages (see the layout's en fallback), so it carries no translatable
    # copy. `alt` is a generic, per-screen accessible description.
    alt: "FormuLens app screen"
    shots:
      - /assets/screenshots/formulens/01-decode.png
      - /assets/screenshots/formulens/02-modes.png
      - /assets/screenshots/formulens/03-categories.png
      - /assets/screenshots/formulens/04-scan.png
      - /assets/screenshots/formulens/05-summary.png
      - /assets/screenshots/formulens/06-legend.png
      - /assets/screenshots/formulens/07-differences.png
      - /assets/screenshots/formulens/08-metrics.png
