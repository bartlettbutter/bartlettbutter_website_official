# Per-app marketing data for Barkpedia, keyed by language code (mirrors the
# convention in _data/home.yml). Consumed by _layouts/app-barkpedia.html via
# _includes/marketing/showcase.html and hero-gallery.html. Each language
# mirrors the `en` structure; languages without their own entry fall back to
# `en` so every localized page still renders the showcase.
#
# Screenshots live in /assets/screenshots/barkpedia/ (660px-wide web copies of
# the App Store mockups; the captions baked into each image are English, so the
# narratives here add explanation rather than repeat the on-image text).

en:
  hero_gallery:
    # No label/title: this strip is purely visual and shared across all
    # languages (see the layout's en fallback), so it carries no translatable
    # copy. `alt` is a generic, per-screen accessible description.
    alt: "Barkpedia app screen"
    shots:
      - /assets/screenshots/barkpedia/01-welcome.png
      - /assets/screenshots/barkpedia/02-identify.png
      - /assets/screenshots/barkpedia/03-profile.png
      - /assets/screenshots/barkpedia/04-favorites.png
      - /assets/screenshots/barkpedia/05-explore.png
      - /assets/screenshots/barkpedia/06-quiz.png
      - /assets/screenshots/barkpedia/07-trivia.png
  showcase:
    label: "See it in action"
    title: "From a quick photo to the whole breed story"
    intro: "Every screen of Barkpedia is built to answer a dog lover's questions fast: what breed is this, where does it come from, and what is it really like?"
    shots:
      - image: /assets/screenshots/barkpedia/01-welcome.png
        alt: "Barkpedia welcome screen listing scan, breed profiles, quizzes, and trivia"
        title: "Your pocket guide to the dog world"
        body: "Open Barkpedia and start right away — no account, no sign-up, no cost. Breed scanning runs right on your device and works offline from the first tap, while breed profiles and quiz photos load whenever you are connected."
      - image: /assets/screenshots/barkpedia/02-identify.png
        alt: "Scan screen showing a Miniature Poodle identified with a confidence score and other possibilities"
        title: "Point your camera, name the breed"
        body: "Snap a photo or pick one from your library and get a breed match with a confidence score, plus a ranked list of other possibilities so close calls are never a guess."
      - image: /assets/screenshots/barkpedia/03-profile.png
        alt: "Breed details screen for the Miniature Poodle with temperament, life span, weight, height, origin, and history"
        title: "Every breed, fully profiled"
        body: "Each result opens a rich AKC-style profile — temperament, life span, weight, height, country of origin, and the breed's history — so you learn the story behind the dog, not just its name."
      - image: /assets/screenshots/barkpedia/04-favorites.png
        alt: "Favorites grid of saved breed scans including Shiba Inu, Beagle, and Miniature Poodle"
        title: "Build your own breed library"
        body: "Love a breed? Save any scan and revisit it anytime. Your favorites form a personal library that stays stored locally on your device."
      - image: /assets/screenshots/barkpedia/05-explore.png
        alt: "Explore screen with a breed search bar and an interactive world map of breeds by country"
        title: "Explore breeds around the world"
        body: "Search 147 breeds by name, or browse an interactive world map organized by country of origin. Tap a pin to see which breeds come from that region and dive into their profiles."
      - image: /assets/screenshots/barkpedia/06-quiz.png
        alt: "Breed Quiz screen asking which breed is shown, with a Pembroke Welsh Corgi answered correctly"
        title: "Test yourself with Breed Quiz"
        body: "Guess the breed from a photo across ten multiple-choice questions, earn reward titles, and turn everything you have scanned into a game."
      - image: /assets/screenshots/barkpedia/07-trivia.png
        alt: "Dog Trivia screen showing a true-or-false myth question answered correctly"
        title: "Bust myths with Dog Trivia"
        body: "Take on ten rounds of true-or-false questions that mix real facts with clever myths, so you pick up practical dog knowledge while you play — offline, anytime."

zh-Hans:
  showcase:
    label: "实际体验"
    title: "从一张随手拍的照片，到完整的品种故事"
    intro: "Barkpedia 的每一个界面都为快速解答爱狗人士的疑问而设计：这是什么品种？它来自哪里？它的真实性格是怎样的？"
    shots:
      - image: /assets/screenshots/barkpedia/01-welcome.png
        alt: "Barkpedia 欢迎界面，列出扫描、品种档案、测验和问答"
        title: "您的口袋狗狗世界指南"
        body: "打开 Barkpedia 即可立即开始——无需账户，无需注册，无需付费。品种扫描直接在您的设备上运行，从第一次点按起即可离线使用；品种档案和测验照片则会在联网时加载。"
      - image: /assets/screenshots/barkpedia/02-identify.png
        alt: "扫描界面，显示识别出的迷你贵宾犬及其置信度分数和其他可能的品种"
        title: "对准相机，叫出品种"
        body: "拍一张照片或从图库中选择一张，即可获得带有置信度分数的品种匹配，以及按可能性排序的其他候选品种，难以分辨时也不必靠猜。"
      - image: /assets/screenshots/barkpedia/03-profile.png
        alt: "迷你贵宾犬的品种详情界面，包含性格、寿命、体重、身高、起源和历史"
        title: "每个品种，档案齐全"
        body: "每个结果都会打开一份内容丰富的 AKC 风格档案——性格、寿命、体重、身高、原产国以及品种历史——让您了解的不只是狗狗的名字，更是它背后的故事。"
      - image: /assets/screenshots/barkpedia/04-favorites.png
        alt: "收藏网格，显示已保存的品种扫描，包括柴犬、比格犬和迷你贵宾犬"
        title: "打造您自己的品种图书馆"
        body: "喜欢某个品种？保存任意一次扫描，随时回顾。您的收藏会组成一个专属的个人图书馆，并始终存储在您的设备本地。"
      - image: /assets/screenshots/barkpedia/05-explore.png
        alt: "探索界面，带有品种搜索栏和按国家分布品种的交互式世界地图"
        title: "探索世界各地的品种"
        body: "按名称搜索 147 个品种，或浏览按原产国划分的交互式世界地图。点击图钉即可查看来自该地区的品种，并深入了解它们的档案。"
      - image: /assets/screenshots/barkpedia/06-quiz.png
        alt: "品种测验界面，询问图中是什么品种，彭布罗克威尔士柯基犬已答对"
        title: "用品种测验考考自己"
        body: "通过十道选择题根据照片猜品种，赢取奖励称号，把您扫描过的一切都变成一场游戏。"
      - image: /assets/screenshots/barkpedia/07-trivia.png
        alt: "狗狗问答界面，显示一道已答对的真假谬误题"
        title: "用狗狗问答破除谬误"
        body: "挑战十轮真假判断题，题目将真实的事实与巧妙的谬误混合在一起，让您在游戏中学到实用的狗狗知识——随时随地，离线也能玩。"

zh-Hant:
  showcase:
    label: "實際體驗"
    title: "從一張隨手拍的照片，到完整的品種故事"
    intro: "Barkpedia 的每一個畫面都為快速解答愛狗人士的疑問而設計：這是什麼品種？牠來自哪裡？牠的真實性格又是如何？"
    shots:
      - image: /assets/screenshots/barkpedia/01-welcome.png
        alt: "Barkpedia 歡迎畫面，列出掃描、品種檔案、測驗與問答"
        title: "您的口袋狗狗世界指南"
        body: "打開 Barkpedia 即可立即開始——無需帳號、無需註冊、無需付費。品種掃描直接在您的裝置上執行，從第一次點按起即可離線使用；品種檔案與測驗照片則會在連線時載入。"
      - image: /assets/screenshots/barkpedia/02-identify.png
        alt: "掃描畫面，顯示辨識出的迷你貴賓犬及其置信度分數與其他可能的品種"
        title: "對準相機，叫出品種"
        body: "拍一張照片或從圖庫中挑選一張，即可獲得帶有置信度分數的品種匹配，以及依可能性排序的其他候選品種，難以分辨時也不必用猜的。"
      - image: /assets/screenshots/barkpedia/03-profile.png
        alt: "迷你貴賓犬的品種詳情畫面，包含性格、壽命、體重、身高、起源與歷史"
        title: "每個品種，檔案齊全"
        body: "每個結果都會開啟一份內容豐富的 AKC 風格檔案——性格、壽命、體重、身高、原產國以及品種歷史——讓您認識的不只是狗狗的名字，更是牠背後的故事。"
      - image: /assets/screenshots/barkpedia/04-favorites.png
        alt: "收藏網格，顯示已儲存的品種掃描，包括柴犬、米格魯與迷你貴賓犬"
        title: "打造您專屬的品種圖書館"
        body: "喜歡某個品種？儲存任何一次掃描，隨時回顧。您的收藏會組成一座個人圖書館，並始終儲存在您的裝置本機。"
      - image: /assets/screenshots/barkpedia/05-explore.png
        alt: "探索畫面，具有品種搜尋列與依國家分布品種的互動式世界地圖"
        title: "探索世界各地的品種"
        body: "依名稱搜尋 147 個品種，或瀏覽依原產國劃分的互動式世界地圖。點選圖釘即可查看來自該地區的品種，並深入了解牠們的檔案。"
      - image: /assets/screenshots/barkpedia/06-quiz.png
        alt: "品種測驗畫面，詢問圖中是什麼品種，潘布魯克威爾斯柯基犬已答對"
        title: "用品種測驗考考自己"
        body: "透過十道選擇題根據照片猜品種，贏取獎勵稱號，把您掃描過的一切都變成一場遊戲。"
      - image: /assets/screenshots/barkpedia/07-trivia.png
        alt: "狗狗問答畫面，顯示一道已答對的真假迷思題"
        title: "用狗狗問答破解迷思"
        body: "挑戰十輪真假判斷題，題目將真實的事實與巧妙的迷思混合在一起，讓您在遊戲中學到實用的狗狗知識——隨時隨地，離線也能玩。"

ja:
  showcase:
    label: "実際の動作を見る"
    title: "さっと撮った一枚から、品種の物語のすべてへ"
    intro: "Barkpediaのすべての画面は、犬好きの疑問にすばやく答えるために作られています。この犬の品種は？どこから来たの？本当はどんな性格？"
    shots:
      - image: /assets/screenshots/barkpedia/01-welcome.png
        alt: "スキャン、品種プロフィール、クイズ、トリビアが並ぶBarkpediaのウェルカム画面"
        title: "ポケットに入る、犬の世界のガイド"
        body: "Barkpediaを開けばすぐに始められます。アカウントも登録も費用も不要。品種スキャンはデバイス上で動作し、最初のタップからオフラインで使えます。品種プロフィールやクイズの写真は、接続時に読み込まれます。"
      - image: /assets/screenshots/barkpedia/02-identify.png
        alt: "トイ・プードルが信頼度スコアとほかの候補とともに識別されたスキャン画面"
        title: "カメラを向けて、品種がわかる"
        body: "写真を撮るか、ライブラリから選ぶだけで、信頼度スコア付きの品種マッチと、ほかの候補のランキングを表示。見分けにくい場合も当て推量になりません。"
      - image: /assets/screenshots/barkpedia/03-profile.png
        alt: "性格、寿命、体重、体高、原産地、歴史を表示したトイ・プードルの品種詳細画面"
        title: "どの品種も、詳しくプロフィール化"
        body: "各結果からは、AKCスタイルの充実したプロフィールが開きます。性格、寿命、体重、体高、原産国、そして品種の歴史まで。名前だけでなく、その犬の背景にある物語を知ることができます。"
      - image: /assets/screenshots/barkpedia/04-favorites.png
        alt: "柴犬、ビーグル、トイ・プードルなど保存した品種スキャンが並ぶお気に入りグリッド"
        title: "自分だけの品種ライブラリを作ろう"
        body: "気に入った品種は、スキャンを保存していつでも見返せます。お気に入りは、デバイス内にローカル保存される自分だけのライブラリになります。"
      - image: /assets/screenshots/barkpedia/05-explore.png
        alt: "品種検索バーと、国ごとの品種を示すインタラクティブな世界地図がある探索画面"
        title: "世界中の品種を探索"
        body: "147品種を名前で検索したり、原産国ごとに整理されたインタラクティブな世界地図を眺めたり。ピンをタップすると、その地域出身の品種が表示され、プロフィールを詳しく読めます。"
      - image: /assets/screenshots/barkpedia/06-quiz.png
        alt: "写真の品種を問う品種クイズ画面で、ウェルシュ・コーギー・ペンブロークに正解したところ"
        title: "品種クイズで腕試し"
        body: "10問の選択式クイズで写真から品種を当て、報酬タイトルを獲得。スキャンしてきたすべてがゲームに変わります。"
      - image: /assets/screenshots/barkpedia/07-trivia.png
        alt: "本当か嘘かを問う俗説の問題に正解した犬トリビア画面"
        title: "犬トリビアで俗説を見破ろう"
        body: "本当の事実と巧妙な俗説が入り混じった、本当か嘘かの問題に10ラウンド挑戦。遊びながら役立つ犬の知識が身につきます。オフラインで、いつでも。"

ko:
  showcase:
    label: "실제로 사용해 보기"
    title: "가볍게 찍은 사진 한 장에서 품종의 모든 이야기까지"
    intro: "Barkpedia의 모든 화면은 애견인의 궁금증에 빠르게 답하도록 만들어졌습니다. 이 개는 무슨 품종일까? 어디에서 왔을까? 실제로는 어떤 성격일까?"
    shots:
      - image: /assets/screenshots/barkpedia/01-welcome.png
        alt: "스캔, 품종 프로필, 퀴즈, 상식 퀴즈가 나열된 Barkpedia 시작 화면"
        title: "주머니 속 개의 세계 가이드"
        body: "Barkpedia를 열면 바로 시작할 수 있습니다. 계정도, 가입도, 비용도 필요 없습니다. 품종 스캔은 기기에서 바로 실행되어 첫 탭부터 오프라인으로 작동하며, 품종 프로필과 퀴즈 사진은 연결되어 있을 때 불러옵니다."
      - image: /assets/screenshots/barkpedia/02-identify.png
        alt: "미니어처 푸들이 신뢰도 점수 및 다른 가능성과 함께 식별된 스캔 화면"
        title: "카메라를 비추면 품종을 알려줍니다"
        body: "사진을 찍거나 보관함에서 하나를 고르면 신뢰도 점수가 포함된 품종 일치 결과와 다른 가능성의 순위 목록을 받아볼 수 있어, 애매한 경우에도 짐작에 의존할 필요가 없습니다."
      - image: /assets/screenshots/barkpedia/03-profile.png
        alt: "기질, 수명, 체중, 체고, 원산지, 역사가 담긴 미니어처 푸들 품종 상세 화면"
        title: "모든 품종을 빠짐없이 소개"
        body: "각 결과는 기질, 수명, 체중, 체고, 원산국, 품종의 역사까지 담은 풍부한 AKC 스타일 프로필로 이어집니다. 이름만이 아니라 그 개에 얽힌 이야기까지 알게 됩니다."
      - image: /assets/screenshots/barkpedia/04-favorites.png
        alt: "시바견, 비글, 미니어처 푸들 등 저장된 품종 스캔이 담긴 즐겨찾기 그리드"
        title: "나만의 품종 라이브러리 만들기"
        body: "마음에 드는 품종이 있나요? 어떤 스캔이든 저장해 두고 언제든 다시 볼 수 있습니다. 즐겨찾기는 기기에 로컬로 저장되는 나만의 라이브러리가 됩니다."
      - image: /assets/screenshots/barkpedia/05-explore.png
        alt: "품종 검색창과 국가별 품종을 보여주는 인터랙티브 세계 지도가 있는 탐색 화면"
        title: "전 세계의 품종 탐색"
        body: "147개 품종을 이름으로 검색하거나, 원산국별로 정리된 인터랙티브 세계 지도를 둘러보세요. 핀을 누르면 그 지역에서 온 품종을 확인하고 프로필을 자세히 살펴볼 수 있습니다."
      - image: /assets/screenshots/barkpedia/06-quiz.png
        alt: "사진 속 품종을 묻는 품종 퀴즈 화면에서 펨브로크 웰시 코기를 맞힌 모습"
        title: "품종 퀴즈로 실력 테스트"
        body: "열 개의 객관식 문제로 사진 속 품종을 맞히고 보상 타이틀을 얻으며, 지금까지 스캔한 모든 것을 게임으로 즐겨보세요."
      - image: /assets/screenshots/barkpedia/07-trivia.png
        alt: "참·거짓 속설 문제를 맞힌 개 상식 퀴즈 화면"
        title: "개 상식 퀴즈로 속설 깨기"
        body: "진짜 사실과 그럴듯한 속설이 섞인 참·거짓 문제 열 라운드에 도전하며, 게임을 즐기는 동안 실용적인 개 지식을 쌓아보세요. 오프라인으로, 언제든지."

es:
  showcase:
    label: "Míralo en acción"
    title: "De una foto rápida a toda la historia de la raza"
    intro: "Cada pantalla de Barkpedia está pensada para responder rápido a las preguntas de cualquier amante de los perros: ¿de qué raza es?, ¿de dónde viene? y ¿cómo es en realidad?"
    shots:
      - image: /assets/screenshots/barkpedia/01-welcome.png
        alt: "Pantalla de bienvenida de Barkpedia con escaneo, perfiles de razas, concursos y curiosidades"
        title: "Tu guía de bolsillo del mundo canino"
        body: "Abre Barkpedia y empieza al momento: sin cuenta, sin registro y sin coste. El escaneo de razas se ejecuta directamente en tu dispositivo y funciona sin conexión desde el primer toque, mientras que los perfiles de razas y las fotos del concurso se cargan cuando estás conectado."
      - image: /assets/screenshots/barkpedia/02-identify.png
        alt: "Pantalla de escaneo que muestra un Caniche Miniatura identificado con una puntuación de confianza y otras posibilidades"
        title: "Apunta con la cámara y descubre la raza"
        body: "Haz una foto o elige una de tu fototeca y obtén una coincidencia de raza con una puntuación de confianza, además de una lista ordenada de otras posibilidades para que los casos dudosos nunca queden al azar."
      - image: /assets/screenshots/barkpedia/03-profile.png
        alt: "Pantalla de detalles del Caniche Miniatura con temperamento, esperanza de vida, peso, altura, origen e historia"
        title: "Cada raza, con su perfil completo"
        body: "Cada resultado abre un completo perfil al estilo AKC (temperamento, esperanza de vida, peso, altura, país de origen e historia de la raza) para que conozcas la historia que hay detrás del perro, no solo su nombre."
      - image: /assets/screenshots/barkpedia/04-favorites.png
        alt: "Cuadrícula de favoritos con escaneos de razas guardados, como Shiba Inu, Beagle y Caniche Miniatura"
        title: "Crea tu propia biblioteca de razas"
        body: "¿Te encanta una raza? Guarda cualquier escaneo y vuelve a verlo cuando quieras. Tus favoritos forman una biblioteca personal que se queda guardada localmente en tu dispositivo."
      - image: /assets/screenshots/barkpedia/05-explore.png
        alt: "Pantalla Explorar con una barra de búsqueda de razas y un mapa mundial interactivo de razas por país"
        title: "Explora razas de todo el mundo"
        body: "Busca entre 147 razas por nombre o recorre un mapa mundial interactivo organizado por país de origen. Toca un marcador para ver qué razas proceden de esa región y sumérgete en sus perfiles."
      - image: /assets/screenshots/barkpedia/06-quiz.png
        alt: "Pantalla del Concurso de Razas que pregunta qué raza aparece, con un Corgi Galés de Pembroke acertado"
        title: "Ponte a prueba con el Concurso de Razas"
        body: "Adivina la raza a partir de una foto en diez preguntas de opción múltiple, gana títulos de recompensa y convierte todo lo que has escaneado en un juego."
      - image: /assets/screenshots/barkpedia/07-trivia.png
        alt: "Pantalla de Curiosidades Caninas con una pregunta de mito de verdadero o falso respondida correctamente"
        title: "Desmonta mitos con Curiosidades Caninas"
        body: "Enfréntate a diez rondas de preguntas de verdadero o falso que mezclan datos reales con mitos ingeniosos, para que aprendas conocimientos caninos prácticos mientras juegas, sin conexión y cuando quieras."

fr:
  showcase:
    label: "Voyez-le en action"
    title: "D'une simple photo à toute l'histoire de la race"
    intro: "Chaque écran de Barkpedia est conçu pour répondre vite aux questions des amoureux des chiens : de quelle race s'agit-il, d'où vient-elle et comment est-elle vraiment ?"
    shots:
      - image: /assets/screenshots/barkpedia/01-welcome.png
        alt: "Écran d'accueil de Barkpedia présentant le scan, les fiches de race, les quiz et les anecdotes"
        title: "Votre guide de poche du monde canin"
        body: "Ouvrez Barkpedia et commencez tout de suite : sans compte, sans inscription et sans frais. Le scan des races s'exécute directement sur votre appareil et fonctionne hors ligne dès le premier geste, tandis que les fiches de race et les photos du quiz se chargent dès que vous êtes connecté."
      - image: /assets/screenshots/barkpedia/02-identify.png
        alt: "Écran de scan montrant un Caniche nain identifié avec un score de confiance et d'autres possibilités"
        title: "Visez avec l'appareil photo, découvrez la race"
        body: "Prenez une photo ou choisissez-en une dans votre photothèque pour obtenir une correspondance de race avec un score de confiance, ainsi qu'une liste classée d'autres possibilités : les cas serrés ne relèvent jamais du hasard."
      - image: /assets/screenshots/barkpedia/03-profile.png
        alt: "Écran de détails du Caniche nain avec tempérament, espérance de vie, poids, taille, origine et histoire"
        title: "Chaque race, entièrement décrite"
        body: "Chaque résultat ouvre une fiche complète de style AKC (tempérament, espérance de vie, poids, taille, pays d'origine et histoire de la race) pour que vous découvriez l'histoire du chien, pas seulement son nom."
      - image: /assets/screenshots/barkpedia/04-favorites.png
        alt: "Grille de favoris avec des scans de races enregistrés, dont Shiba Inu, Beagle et Caniche nain"
        title: "Constituez votre propre bibliothèque de races"
        body: "Vous adorez une race ? Enregistrez n'importe quel scan et retrouvez-le à tout moment. Vos favoris forment une bibliothèque personnelle qui reste stockée localement sur votre appareil."
      - image: /assets/screenshots/barkpedia/05-explore.png
        alt: "Écran Explorer avec une barre de recherche de races et une carte du monde interactive des races par pays"
        title: "Explorez les races du monde entier"
        body: "Recherchez parmi 147 races par nom, ou parcourez une carte du monde interactive organisée par pays d'origine. Touchez un repère pour voir les races originaires de cette région et plongez dans leurs fiches."
      - image: /assets/screenshots/barkpedia/06-quiz.png
        alt: "Écran du Quiz des Races demandant quelle race est représentée, avec un Welsh Corgi Pembroke trouvé"
        title: "Testez-vous avec le Quiz des Races"
        body: "Devinez la race à partir d'une photo au fil de dix questions à choix multiples, gagnez des titres de récompense et transformez tout ce que vous avez scanné en jeu."
      - image: /assets/screenshots/barkpedia/07-trivia.png
        alt: "Écran des Anecdotes Canines montrant une question vrai ou faux sur une idée reçue, bien répondue"
        title: "Démontez les idées reçues avec les Anecdotes Canines"
        body: "Relevez dix manches de questions vrai ou faux qui mêlent faits réels et mythes bien trouvés, pour acquérir des connaissances canines pratiques tout en jouant, hors ligne et à tout moment."

de:
  showcase:
    label: "Sieh es in Aktion"
    title: "Von einem schnellen Foto zur ganzen Geschichte der Rasse"
    intro: "Jeder Bildschirm von Barkpedia ist darauf ausgelegt, die Fragen von Hundeliebhabern schnell zu beantworten: Welche Rasse ist das, woher stammt sie und wie ist sie wirklich?"
    shots:
      - image: /assets/screenshots/barkpedia/01-welcome.png
        alt: "Barkpedia-Willkommensbildschirm mit Scan, Rassenprofilen, Quiz und Trivia"
        title: "Dein Taschenführer durch die Welt der Hunde"
        body: "Öffne Barkpedia und leg sofort los – kein Konto, keine Anmeldung, keine Kosten. Der Rassen-Scan läuft direkt auf deinem Gerät und funktioniert vom ersten Tippen an offline, während Rassenprofile und Quizfotos geladen werden, sobald du verbunden bist."
      - image: /assets/screenshots/barkpedia/02-identify.png
        alt: "Scan-Bildschirm mit einem erkannten Zwergpudel samt Konfidenzwert und weiteren Möglichkeiten"
        title: "Kamera drauf, Rasse erkannt"
        body: "Mach ein Foto oder wähle eines aus deiner Mediathek und erhalte eine Rassenübereinstimmung mit Konfidenzwert sowie eine geordnete Liste weiterer Möglichkeiten – so musst du bei knappen Fällen nie raten."
      - image: /assets/screenshots/barkpedia/03-profile.png
        alt: "Rassendetails des Zwergpudels mit Temperament, Lebenserwartung, Gewicht, Größe, Herkunft und Geschichte"
        title: "Jede Rasse mit vollständigem Profil"
        body: "Jedes Ergebnis öffnet ein reichhaltiges Profil im AKC-Stil – Temperament, Lebenserwartung, Gewicht, Größe, Herkunftsland und die Geschichte der Rasse –, damit du die Geschichte hinter dem Hund kennenlernst, nicht nur seinen Namen."
      - image: /assets/screenshots/barkpedia/04-favorites.png
        alt: "Favoriten-Raster mit gespeicherten Rassen-Scans, darunter Shiba Inu, Beagle und Zwergpudel"
        title: "Bau dir deine eigene Rassenbibliothek auf"
        body: "Du liebst eine Rasse? Speichere jeden Scan und sieh ihn dir jederzeit wieder an. Deine Favoriten bilden eine persönliche Bibliothek, die lokal auf deinem Gerät gespeichert bleibt."
      - image: /assets/screenshots/barkpedia/05-explore.png
        alt: "Entdecken-Bildschirm mit Rassensuchleiste und interaktiver Weltkarte der Rassen nach Land"
        title: "Entdecke Rassen aus aller Welt"
        body: "Suche 147 Rassen nach Namen oder durchstöbere eine interaktive Weltkarte, geordnet nach Herkunftsland. Tippe auf eine Markierung, um zu sehen, welche Rassen aus dieser Region stammen, und tauche in ihre Profile ein."
      - image: /assets/screenshots/barkpedia/06-quiz.png
        alt: "Rassen-Quiz-Bildschirm mit der Frage nach der abgebildeten Rasse, ein Welsh Corgi Pembroke richtig beantwortet"
        title: "Teste dich mit dem Rassen-Quiz"
        body: "Errate die Rasse anhand eines Fotos in zehn Multiple-Choice-Fragen, verdiene Belohnungstitel und mach aus allem, was du gescannt hast, ein Spiel."
      - image: /assets/screenshots/barkpedia/07-trivia.png
        alt: "Hunde-Trivia-Bildschirm mit einer richtig beantworteten Richtig-oder-falsch-Frage zu einem Mythos"
        title: "Entlarve Mythen mit Hunde-Trivia"
        body: "Stell dich zehn Runden mit Richtig-oder-falsch-Fragen, die echte Fakten mit cleveren Mythen mischen – so eignest du dir beim Spielen praktisches Hundewissen an, offline und jederzeit."

it:
  showcase:
    label: "Guardalo in azione"
    title: "Da una foto veloce a tutta la storia della razza"
    intro: "Ogni schermata di Barkpedia è pensata per rispondere in fretta alle domande di chi ama i cani: di che razza è, da dove viene e com'è davvero?"
    shots:
      - image: /assets/screenshots/barkpedia/01-welcome.png
        alt: "Schermata di benvenuto di Barkpedia con scansione, profili delle razze, quiz e curiosità"
        title: "La tua guida tascabile al mondo dei cani"
        body: "Apri Barkpedia e inizia subito: nessun account, nessuna registrazione, nessun costo. La scansione delle razze avviene direttamente sul tuo dispositivo e funziona offline fin dal primo tocco, mentre i profili delle razze e le foto del quiz si caricano quando sei connesso."
      - image: /assets/screenshots/barkpedia/02-identify.png
        alt: "Schermata di scansione con un Barboncino nano identificato, punteggio di affidabilità e altre possibilità"
        title: "Inquadra con la fotocamera, scopri la razza"
        body: "Scatta una foto o scegline una dalla libreria e ottieni una corrispondenza di razza con un punteggio di affidabilità, oltre a un elenco ordinato di altre possibilità, così nei casi incerti non devi mai tirare a indovinare."
      - image: /assets/screenshots/barkpedia/03-profile.png
        alt: "Schermata dei dettagli del Barboncino nano con temperamento, aspettativa di vita, peso, altezza, origine e storia"
        title: "Ogni razza, con il suo profilo completo"
        body: "Ogni risultato apre un ricco profilo in stile AKC (temperamento, aspettativa di vita, peso, altezza, paese d'origine e storia della razza) così scopri la storia dietro il cane, non solo il suo nome."
      - image: /assets/screenshots/barkpedia/04-favorites.png
        alt: "Griglia dei preferiti con scansioni di razze salvate, tra cui Shiba Inu, Beagle e Barboncino nano"
        title: "Crea la tua biblioteca delle razze"
        body: "Ami una razza? Salva qualsiasi scansione e rivedila quando vuoi. I tuoi preferiti formano una biblioteca personale che resta archiviata localmente sul tuo dispositivo."
      - image: /assets/screenshots/barkpedia/05-explore.png
        alt: "Schermata Esplora con barra di ricerca delle razze e mappa del mondo interattiva delle razze per paese"
        title: "Esplora le razze di tutto il mondo"
        body: "Cerca tra 147 razze per nome o sfoglia una mappa del mondo interattiva organizzata per paese d'origine. Tocca un segnaposto per vedere quali razze provengono da quella regione e approfondisci i loro profili."
      - image: /assets/screenshots/barkpedia/06-quiz.png
        alt: "Schermata del Quiz delle Razze che chiede quale razza è raffigurata, con un Welsh Corgi Pembroke indovinato"
        title: "Mettiti alla prova con il Quiz delle Razze"
        body: "Indovina la razza da una foto in dieci domande a risposta multipla, guadagna titoli di ricompensa e trasforma tutto ciò che hai scansionato in un gioco."
      - image: /assets/screenshots/barkpedia/07-trivia.png
        alt: "Schermata di Curiosità Cinofile con una domanda vero o falso su un mito a cui si è risposto correttamente"
        title: "Sfata i miti con Curiosità Cinofile"
        body: "Affronta dieci round di domande vero o falso che mescolano fatti reali e miti ingegnosi, così impari nozioni pratiche sui cani mentre giochi, offline e in qualsiasi momento."

pt:
  showcase:
    label: "Veja em ação"
    title: "De uma foto rápida a toda a história da raça"
    intro: "Cada tela do Barkpedia foi criada para responder rápido às perguntas de quem ama cães: que raça é essa, de onde ela vem e como ela é de verdade?"
    shots:
      - image: /assets/screenshots/barkpedia/01-welcome.png
        alt: "Tela de boas-vindas do Barkpedia com escaneamento, perfis de raças, quizzes e curiosidades"
        title: "Seu guia de bolso do mundo canino"
        body: "Abra o Barkpedia e comece na hora: sem conta, sem cadastro e sem custo. O escaneamento de raças roda direto no seu dispositivo e funciona offline desde o primeiro toque, enquanto os perfis de raças e as fotos do quiz são carregados sempre que você estiver conectado."
      - image: /assets/screenshots/barkpedia/02-identify.png
        alt: "Tela de escaneamento mostrando um Poodle Miniatura identificado com pontuação de confiança e outras possibilidades"
        title: "Aponte a câmera e descubra a raça"
        body: "Tire uma foto ou escolha uma da sua biblioteca e receba uma correspondência de raça com pontuação de confiança, além de uma lista ordenada de outras possibilidades, para que os casos difíceis nunca fiquem no chute."
      - image: /assets/screenshots/barkpedia/03-profile.png
        alt: "Tela de detalhes do Poodle Miniatura com temperamento, expectativa de vida, peso, altura, origem e história"
        title: "Cada raça com perfil completo"
        body: "Cada resultado abre um perfil completo no estilo AKC (temperamento, expectativa de vida, peso, altura, país de origem e a história da raça) para você conhecer a história por trás do cão, não apenas o nome dele."
      - image: /assets/screenshots/barkpedia/04-favorites.png
        alt: "Grade de favoritos com escaneamentos de raças salvos, incluindo Shiba Inu, Beagle e Poodle Miniatura"
        title: "Monte sua própria biblioteca de raças"
        body: "Adorou uma raça? Salve qualquer escaneamento e veja de novo quando quiser. Seus favoritos formam uma biblioteca pessoal que fica armazenada localmente no seu dispositivo."
      - image: /assets/screenshots/barkpedia/05-explore.png
        alt: "Tela Explorar com barra de busca de raças e mapa-múndi interativo de raças por país"
        title: "Explore raças do mundo todo"
        body: "Busque entre 147 raças pelo nome ou navegue por um mapa-múndi interativo organizado por país de origem. Toque em um marcador para ver quais raças vêm daquela região e mergulhe nos perfis delas."
      - image: /assets/screenshots/barkpedia/06-quiz.png
        alt: "Tela do Quiz de Raças perguntando qual raça aparece, com um Welsh Corgi Pembroke respondido corretamente"
        title: "Teste-se com o Quiz de Raças"
        body: "Adivinhe a raça a partir de uma foto em dez perguntas de múltipla escolha, ganhe títulos de recompensa e transforme tudo o que você escaneou em um jogo."
      - image: /assets/screenshots/barkpedia/07-trivia.png
        alt: "Tela de Curiosidades Caninas mostrando uma pergunta de verdadeiro ou falso sobre um mito respondida corretamente"
        title: "Derrube mitos com Curiosidades Caninas"
        body: "Encare dez rodadas de perguntas de verdadeiro ou falso que misturam fatos reais com mitos engenhosos, para você aprender conhecimentos práticos sobre cães enquanto joga, offline e a qualquer hora."

ru:
  showcase:
    label: "Посмотрите в действии"
    title: "От быстрого снимка до всей истории породы"
    intro: "Каждый экран Barkpedia создан, чтобы быстро отвечать на вопросы любителей собак: что это за порода, откуда она родом и какая она на самом деле?"
    shots:
      - image: /assets/screenshots/barkpedia/01-welcome.png
        alt: "Приветственный экран Barkpedia со сканированием, профилями пород, викториной и фактами"
        title: "Ваш карманный путеводитель по миру собак"
        body: "Откройте Barkpedia и начните сразу — без аккаунта, без регистрации и без затрат. Сканирование пород выполняется прямо на вашем устройстве и работает офлайн с первого касания, а профили пород и фотографии для викторины загружаются, когда вы подключены к сети."
      - image: /assets/screenshots/barkpedia/02-identify.png
        alt: "Экран сканирования с определённым миниатюрным пуделем, оценкой достоверности и другими вариантами"
        title: "Наведите камеру — узнайте породу"
        body: "Сделайте снимок или выберите фото из медиатеки и получите совпадение породы с оценкой достоверности, а также упорядоченный список других вариантов, чтобы в спорных случаях не приходилось гадать."
      - image: /assets/screenshots/barkpedia/03-profile.png
        alt: "Экран сведений о породе миниатюрный пудель с характером, продолжительностью жизни, весом, ростом, происхождением и историей"
        title: "Подробный профиль каждой породы"
        body: "Каждый результат открывает подробный профиль в стиле AKC — характер, продолжительность жизни, вес, рост, страна происхождения и история породы, — чтобы вы узнали историю собаки, а не только её название."
      - image: /assets/screenshots/barkpedia/04-favorites.png
        alt: "Сетка избранного с сохранёнными сканами пород, включая сиба-ину, бигля и миниатюрного пуделя"
        title: "Соберите собственную библиотеку пород"
        body: "Полюбилась порода? Сохраните любой скан и возвращайтесь к нему в любое время. Избранное складывается в личную библиотеку, которая хранится локально на вашем устройстве."
      - image: /assets/screenshots/barkpedia/05-explore.png
        alt: "Экран «Обзор» со строкой поиска пород и интерактивной картой мира с породами по странам"
        title: "Открывайте породы со всего мира"
        body: "Ищите среди 147 пород по названию или изучайте интерактивную карту мира, упорядоченную по стране происхождения. Нажмите на метку, чтобы увидеть, какие породы родом из этого региона, и погрузиться в их профили."
      - image: /assets/screenshots/barkpedia/06-quiz.png
        alt: "Экран викторины о породах с вопросом, какая порода изображена, и правильным ответом — вельш-корги пемброк"
        title: "Проверьте себя в викторине о породах"
        body: "Угадывайте породу по фотографии в десяти вопросах с вариантами ответа, зарабатывайте наградные титулы и превращайте всё, что вы отсканировали, в игру."
      - image: /assets/screenshots/barkpedia/07-trivia.png
        alt: "Экран «Собачьи факты» с правильно отвеченным вопросом о мифе в формате «верно или неверно»"
        title: "Развенчивайте мифы с «Собачьими фактами»"
        body: "Пройдите десять раундов вопросов «верно или неверно», где реальные факты перемешаны с хитрыми мифами, и узнавайте полезное о собаках прямо во время игры — офлайн и в любое время."

ar:
  showcase:
    label: "شاهده أثناء العمل"
    title: "من صورة سريعة إلى قصة السلالة كاملة"
    intro: "صُمّمت كل شاشة في Barkpedia لتجيب بسرعة عن أسئلة محبي الكلاب: ما هذه السلالة، ومن أين أتت، وكيف هي طباعها حقًا؟"
    shots:
      - image: /assets/screenshots/barkpedia/01-welcome.png
        alt: "شاشة الترحيب في Barkpedia تعرض المسح وملفات السلالات والاختبارات والمعلومات"
        title: "دليلك الجيبي إلى عالم الكلاب"
        body: "افتح Barkpedia وابدأ على الفور — بلا حساب، وبلا تسجيل، وبلا تكلفة. يعمل مسح السلالات مباشرة على جهازك ويعمل دون اتصال منذ اللمسة الأولى، بينما تُحمَّل ملفات السلالات وصور الاختبار متى كنت متصلًا."
      - image: /assets/screenshots/barkpedia/02-identify.png
        alt: "شاشة المسح تعرض كلب بودل مصغّر تم التعرّف عليه مع درجة ثقة واحتمالات أخرى"
        title: "وجّه الكاميرا واعرف السلالة"
        body: "التقط صورة أو اختر واحدة من مكتبتك واحصل على تطابق للسلالة مع درجة ثقة، إلى جانب قائمة مرتبة باحتمالات أخرى، فلا تكون الحالات المتقاربة مجرد تخمين."
      - image: /assets/screenshots/barkpedia/03-profile.png
        alt: "شاشة تفاصيل سلالة البودل المصغّر مع الطباع ومتوسط العمر والوزن والطول والأصل والتاريخ"
        title: "ملف كامل لكل سلالة"
        body: "تفتح كل نتيجة ملفًا غنيًا على طراز AKC — الطباع، ومتوسط العمر، والوزن، والطول، وبلد المنشأ، وتاريخ السلالة — لتتعرّف على القصة وراء الكلب، لا اسمه فقط."
      - image: /assets/screenshots/barkpedia/04-favorites.png
        alt: "شبكة المفضلة تضم عمليات مسح محفوظة لسلالات منها شيبا إينو وبيغل وبودل مصغّر"
        title: "أنشئ مكتبة السلالات الخاصة بك"
        body: "أحببت سلالة ما؟ احفظ أي عملية مسح وارجع إليها في أي وقت. تشكّل مفضلاتك مكتبة شخصية تظل مخزّنة محليًا على جهازك."
      - image: /assets/screenshots/barkpedia/05-explore.png
        alt: "شاشة الاستكشاف مع شريط بحث عن السلالات وخريطة عالمية تفاعلية للسلالات حسب البلد"
        title: "استكشف السلالات حول العالم"
        body: "ابحث في 147 سلالة بالاسم، أو تصفّح خريطة عالمية تفاعلية منظّمة حسب بلد المنشأ. اضغط على علامة لترى السلالات القادمة من تلك المنطقة وتعمّق في ملفاتها."
      - image: /assets/screenshots/barkpedia/06-quiz.png
        alt: "شاشة اختبار السلالات تسأل عن السلالة الظاهرة، مع إجابة صحيحة هي كورجي ويلزي بيمبروك"
        title: "اختبر نفسك مع اختبار السلالات"
        body: "خمّن السلالة من صورة عبر عشرة أسئلة متعددة الخيارات، واكسب ألقاب المكافآت، وحوّل كل ما مسحته إلى لعبة."
      - image: /assets/screenshots/barkpedia/07-trivia.png
        alt: "شاشة معلومات الكلاب تعرض سؤال صواب أم خطأ عن خرافة تمت الإجابة عنه بشكل صحيح"
        title: "فنّد الخرافات مع معلومات الكلاب"
        body: "خض عشر جولات من أسئلة صواب أم خطأ تمزج الحقائق الحقيقية بخرافات ذكية، لتكتسب معرفة عملية بالكلاب أثناء اللعب — دون اتصال وفي أي وقت."

hi:
  showcase:
    label: "इसे काम करते हुए देखें"
    title: "एक झटपट तस्वीर से नस्ल की पूरी कहानी तक"
    intro: "Barkpedia की हर स्क्रीन कुत्ता-प्रेमियों के सवालों का जल्दी जवाब देने के लिए बनाई गई है: यह कौन-सी नस्ल है, यह कहाँ से आई है, और असल में यह कैसी होती है?"
    shots:
      - image: /assets/screenshots/barkpedia/01-welcome.png
        alt: "Barkpedia की स्वागत स्क्रीन, जिसमें स्कैन, नस्ल प्रोफ़ाइल, क्विज़ और ट्रिविया सूचीबद्ध हैं"
        title: "कुत्तों की दुनिया की आपकी पॉकेट गाइड"
        body: "Barkpedia खोलें और तुरंत शुरू करें — न कोई अकाउंट, न साइन-अप, न कोई लागत। नस्ल स्कैनिंग सीधे आपके डिवाइस पर चलती है और पहले टैप से ही ऑफ़लाइन काम करती है, जबकि नस्ल प्रोफ़ाइल और क्विज़ की तस्वीरें तब लोड होती हैं जब आप कनेक्टेड हों।"
      - image: /assets/screenshots/barkpedia/02-identify.png
        alt: "स्कैन स्क्रीन, जिसमें विश्वास स्कोर और अन्य संभावनाओं के साथ पहचाना गया मिनिएचर पूडल दिख रहा है"
        title: "कैमरा घुमाएँ, नस्ल जानें"
        body: "एक तस्वीर लें या अपनी लाइब्रेरी से कोई चुनें और विश्वास स्कोर के साथ नस्ल मिलान पाएँ, साथ ही अन्य संभावनाओं की क्रमबद्ध सूची भी, ताकि करीबी मामलों में कभी अंदाज़ा न लगाना पड़े।"
      - image: /assets/screenshots/barkpedia/03-profile.png
        alt: "मिनिएचर पूडल की नस्ल विवरण स्क्रीन, जिसमें स्वभाव, जीवनकाल, वज़न, ऊँचाई, उत्पत्ति और इतिहास है"
        title: "हर नस्ल की पूरी प्रोफ़ाइल"
        body: "हर परिणाम एक समृद्ध AKC-शैली प्रोफ़ाइल खोलता है — स्वभाव, जीवनकाल, वज़न, ऊँचाई, मूल देश और नस्ल का इतिहास — ताकि आप सिर्फ़ कुत्ते का नाम नहीं, उसके पीछे की कहानी भी जानें।"
      - image: /assets/screenshots/barkpedia/04-favorites.png
        alt: "पसंदीदा ग्रिड, जिसमें शीबा इनु, बीगल और मिनिएचर पूडल सहित सहेजे गए नस्ल स्कैन हैं"
        title: "अपनी खुद की नस्ल लाइब्रेरी बनाएँ"
        body: "कोई नस्ल पसंद आई? कोई भी स्कैन सहेजें और कभी भी दोबारा देखें। आपके पसंदीदा एक निजी लाइब्रेरी बनाते हैं जो आपके डिवाइस पर स्थानीय रूप से संग्रहीत रहती है।"
      - image: /assets/screenshots/barkpedia/05-explore.png
        alt: "एक्सप्लोर स्क्रीन, जिसमें नस्ल खोज बार और देश के अनुसार नस्लों का इंटरैक्टिव विश्व मानचित्र है"
        title: "दुनिया भर की नस्लें खोजें"
        body: "147 नस्लों को नाम से खोजें, या मूल देश के अनुसार व्यवस्थित इंटरैक्टिव विश्व मानचित्र ब्राउज़ करें। किसी पिन पर टैप करके देखें कि उस क्षेत्र से कौन-सी नस्लें आती हैं और उनकी प्रोफ़ाइल में गहराई से जाएँ।"
      - image: /assets/screenshots/barkpedia/06-quiz.png
        alt: "नस्ल क्विज़ स्क्रीन, जो पूछती है कि कौन-सी नस्ल दिख रही है, और पेमब्रोक वेल्श कॉर्गी का सही उत्तर दिया गया है"
        title: "नस्ल क्विज़ से खुद को परखें"
        body: "दस बहुविकल्पीय सवालों में तस्वीर से नस्ल का अनुमान लगाएँ, पुरस्कार खिताब अर्जित करें, और आपने जो कुछ स्कैन किया है उसे एक गेम में बदल दें।"
      - image: /assets/screenshots/barkpedia/07-trivia.png
        alt: "कुत्ता ट्रिविया स्क्रीन, जिसमें सही-या-गलत मिथक वाले सवाल का सही उत्तर दिया गया है"
        title: "कुत्ता ट्रिविया से मिथक तोड़ें"
        body: "सही-या-गलत सवालों के दस राउंड का सामना करें जिनमें असली तथ्य और चतुर मिथक मिले होते हैं, ताकि खेलते-खेलते आप कुत्तों के बारे में व्यावहारिक जानकारी पाएँ — ऑफ़लाइन, कभी भी।"

nl:
  showcase:
    label: "Zie het in actie"
    title: "Van een snelle foto naar het hele verhaal van het ras"
    intro: "Elk scherm van Barkpedia is gemaakt om de vragen van hondenliefhebbers snel te beantwoorden: welk ras is dit, waar komt het vandaan en hoe is het echt?"
    shots:
      - image: /assets/screenshots/barkpedia/01-welcome.png
        alt: "Welkomstscherm van Barkpedia met scannen, rasprofielen, quizzen en weetjes"
        title: "Je zakgids voor de hondenwereld"
        body: "Open Barkpedia en ga meteen aan de slag — geen account, geen aanmelding, geen kosten. Het scannen van rassen gebeurt rechtstreeks op je apparaat en werkt vanaf de eerste tik offline, terwijl rasprofielen en quizfoto's worden geladen zodra je verbinding hebt."
      - image: /assets/screenshots/barkpedia/02-identify.png
        alt: "Scanscherm met een herkende dwergpoedel, een betrouwbaarheidsscore en andere mogelijkheden"
        title: "Richt je camera, ken het ras"
        body: "Maak een foto of kies er een uit je bibliotheek en krijg een rasmatch met een betrouwbaarheidsscore, plus een gerangschikte lijst met andere mogelijkheden, zodat je bij twijfelgevallen nooit hoeft te gokken."
      - image: /assets/screenshots/barkpedia/03-profile.png
        alt: "Rasdetailscherm van de dwergpoedel met temperament, levensduur, gewicht, schofthoogte, herkomst en geschiedenis"
        title: "Elk ras, volledig in beeld"
        body: "Elk resultaat opent een uitgebreid profiel in AKC-stijl — temperament, levensduur, gewicht, schofthoogte, land van herkomst en de geschiedenis van het ras — zodat je het verhaal achter de hond leert kennen, niet alleen de naam."
      - image: /assets/screenshots/barkpedia/04-favorites.png
        alt: "Favorietenraster met opgeslagen rasscans, waaronder Shiba Inu, Beagle en dwergpoedel"
        title: "Bouw je eigen rassenbibliotheek op"
        body: "Fan van een ras? Bewaar elke scan en bekijk hem wanneer je maar wilt opnieuw. Je favorieten vormen een persoonlijke bibliotheek die lokaal op je apparaat opgeslagen blijft."
      - image: /assets/screenshots/barkpedia/05-explore.png
        alt: "Ontdekscherm met een zoekbalk voor rassen en een interactieve wereldkaart met rassen per land"
        title: "Ontdek rassen van over de hele wereld"
        body: "Zoek 147 rassen op naam of blader door een interactieve wereldkaart, ingedeeld op land van herkomst. Tik op een speld om te zien welke rassen uit die regio komen en duik in hun profielen."
      - image: /assets/screenshots/barkpedia/06-quiz.png
        alt: "Rassenquiz-scherm dat vraagt welk ras te zien is, met een goed beantwoorde Welsh Corgi Pembroke"
        title: "Test jezelf met de Rassenquiz"
        body: "Raad het ras aan de hand van een foto in tien meerkeuzevragen, verdien beloningstitels en maak van alles wat je hebt gescand een spel."
      - image: /assets/screenshots/barkpedia/07-trivia.png
        alt: "Hondenweetjes-scherm met een goed beantwoorde waar-of-onwaar-vraag over een mythe"
        title: "Ontkracht mythes met Hondenweetjes"
        body: "Ga tien rondes waar-of-onwaar-vragen aan die echte feiten mengen met slimme mythes, zodat je tijdens het spelen praktische hondenkennis opdoet — offline en wanneer je maar wilt."

tr:
  showcase:
    label: "Nasıl çalıştığını görün"
    title: "Hızlı bir fotoğraftan ırkın tüm hikayesine"
    intro: "Barkpedia'nın her ekranı, köpek severlerin sorularını hızla yanıtlamak için tasarlandı: Bu hangi ırk, nereden geliyor ve gerçekte nasıl bir köpek?"
    shots:
      - image: /assets/screenshots/barkpedia/01-welcome.png
        alt: "Tarama, ırk profilleri, yarışmalar ve bilgi yarışmasını listeleyen Barkpedia karşılama ekranı"
        title: "Köpek dünyasına cep rehberiniz"
        body: "Barkpedia'yı açın ve hemen başlayın: hesap yok, kayıt yok, ücret yok. Irk taraması doğrudan cihazınızda çalışır ve ilk dokunuştan itibaren çevrimdışı kullanılabilir; ırk profilleri ve yarışma fotoğrafları ise bağlı olduğunuzda yüklenir."
      - image: /assets/screenshots/barkpedia/02-identify.png
        alt: "Güven puanı ve diğer olasılıklarla tanımlanmış bir Minyatür Kaniş gösteren tarama ekranı"
        title: "Kamerayı doğrultun, ırkı öğrenin"
        body: "Bir fotoğraf çekin ya da arşivinizden birini seçin; güven puanıyla bir ırk eşleşmesi ve diğer olasılıkların sıralı bir listesini alın. Böylece birbirine yakın durumlarda asla tahmine kalmazsınız."
      - image: /assets/screenshots/barkpedia/03-profile.png
        alt: "Mizaç, yaşam süresi, ağırlık, boy, köken ve tarihçeyi içeren Minyatür Kaniş ırk ayrıntıları ekranı"
        title: "Her ırk için eksiksiz bir profil"
        body: "Her sonuç; mizaç, yaşam süresi, ağırlık, boy, köken ülkesi ve ırkın tarihçesini içeren zengin, AKC tarzı bir profil açar. Böylece köpeğin yalnızca adını değil, ardındaki hikayeyi de öğrenirsiniz."
      - image: /assets/screenshots/barkpedia/04-favorites.png
        alt: "Shiba Inu, Beagle ve Minyatür Kaniş dahil kaydedilmiş ırk taramalarını gösteren favoriler ızgarası"
        title: "Kendi ırk kütüphanenizi oluşturun"
        body: "Bir ırkı çok mu sevdiniz? Herhangi bir taramayı kaydedin ve dilediğiniz zaman yeniden bakın. Favorileriniz, cihazınızda yerel olarak saklanan kişisel bir kütüphane oluşturur."
      - image: /assets/screenshots/barkpedia/05-explore.png
        alt: "Irk arama çubuğu ve ülkeye göre ırkları gösteren etkileşimli dünya haritası içeren Keşfet ekranı"
        title: "Dünyanın dört bir yanındaki ırkları keşfedin"
        body: "147 ırkı adına göre arayın ya da köken ülkesine göre düzenlenmiş etkileşimli bir dünya haritasında gezinin. O bölgeden hangi ırkların geldiğini görmek için bir işaretçiye dokunun ve profillerine dalın."
      - image: /assets/screenshots/barkpedia/06-quiz.png
        alt: "Gösterilen ırkın hangisi olduğunu soran ve Pembroke Welsh Corgi'nin doğru yanıtlandığı Irk Yarışması ekranı"
        title: "Irk Yarışması ile kendinizi sınayın"
        body: "On çoktan seçmeli soruda fotoğraftan ırkı tahmin edin, ödül unvanları kazanın ve taradığınız her şeyi bir oyuna dönüştürün."
      - image: /assets/screenshots/barkpedia/07-trivia.png
        alt: "Doğru yanıtlanmış doğru-yanlış efsane sorusunu gösteren Köpek Bilgi Yarışması ekranı"
        title: "Köpek Bilgi Yarışması ile efsaneleri çürütün"
        body: "Gerçek bilgileri akıllıca kurgulanmış efsanelerle harmanlayan on turluk doğru-yanlış sorularına meydan okuyun; oynarken pratik köpek bilgisi edinin, çevrimdışı ve dilediğiniz zaman."
