      - image: /assets/screenshots/linkhq/02-library.png
        alt: "قائمة المكتبة بالروابط المحفوظة مع العناوين والصور المصغّرة والمصادر والوسوم"
        title: "كل شيء محفوظ في مكان واحد"
        body: "تعرض مكتبتك كل رابط من الأحدث إلى الأقدم، بعنوانه الحقيقي وصورته المصغّرة ومصدره ووسومه، فتؤدي ما لا يؤديه عنوان URL مجرّد."
      - image: /assets/screenshots/linkhq/03-details.png
        alt: "تفاصيل الرابط مع صورة معاينة وزر Open Original والمصدر"
        title: "العودة إلى المصدر بنقرة واحدة"
        body: "يُفتح كل رابط في عرض تفاصيل نظيف يضم المعاينة والعنوان والمصدر. انقر Open Original فيعيد iOS فتحه في التطبيق أو الموقع الذي جاء منه."
      - image: /assets/screenshots/linkhq/04-metadata.png
        alt: "معلومات الرابط تعرض تاريخ الإضافة وآخر فتح وحالة التوفر"
        title: "اعرف تاريخه وحالته"
        body: "اطّلع على وقت إضافة الرابط وآخر مرة فُتح فيها، وأعد وسمه بأنه لم يُفتح، وتحقق من أنه ما زال متاحًا قبل أن تبحث عنه."
      - image: /assets/screenshots/linkhq/05-favorites.png
        alt: "تفاصيل رابط وصفة مع صورة وملاحظة وخيار المفضلة مفعّل"
        title: "ملاحظاتك ومفضلتك الخاصة"
        body: "ضع نجمة على الروابط التي تعود إليها دائمًا، وأضف ملاحظة شخصية، مثل تذكير بتجربة التخمير الليلي في نهاية الأسبوع القادم."
      - image: /assets/screenshots/linkhq/06-tags.png
        alt: "قسم التنظيم مع ملاحظة ووسوم وكلمات مفتاحية لرابط محفوظ"
        title: "ضع وسمًا، واعثر عليه لاحقًا"
        body: "أضف وسومك الخاصة إلى جانب الكلمات المفتاحية التي يستخرجها LinkHQ على جهازك، فيسهل جمع الروابط التي تدور حول الموضوع نفسه."
      - image: /assets/screenshots/linkhq/07-filters.png
        alt: "قائمة التصفية بالمفضلة وUnopened وUnavailable والمصادر والكلمات المفتاحية"
        title: "صفِّ في لحظة"
        body: "اختصر المكتبة إلى الروابط المفضلة أو التي لم تُفتح أو غير المتاحة، أو إلى مصدر واحد أو كلمة مفتاحية واحدة."
      - image: /assets/screenshots/linkhq/08-settings.png
        alt: "شاشة الإعدادات مع عدد الروابط المحفوظة وزر Delete All Links"
        title: "مكتبتك تحت سيطرتك"
        body: "تعرض الإعدادات عدد الروابط التي حفظتها وتتيح لك مسح المكتبة كاملة دفعة واحدة. فهي تعيش على جهازك فقط، فلا يبقى شيء خلفك."
      - image: /assets/screenshots/linkhq/09-add-link.png
        alt: "نموذج إضافة رابط بحقول عنوان URL وعنوان اختياري وملاحظة ووسوم"
        title: "أضف أي رابط يدويًا"
        body: "لم تأتِ من ورقة المشاركة؟ الصق أي عنوان URL، وأعطه عنوانًا اختياريًا، وأضف ملاحظة ووسومًا مباشرةً داخل التطبيق."

hi:
  showcase:
    label: "करीब से एक नज़र"
    title: "हर उस चीज़ के लिए एक शांत लाइब्रेरी जिसे आप दोबारा देखना चाहते हैं"
    intro: "देखें कि LinkHQ साझा किए गए लिंक को खोजने योग्य संग्रह में कैसे बदलता है, जिसमें असली शीर्षक, थंबनेल और स्रोत तक लौटने का एक-टैप रास्ता होता है।"
    shots:
      - image: /assets/screenshots/linkhq/01-welcome.png
        alt: "LinkHQ का स्वागत स्क्रीन, जो सहेजना, खोजना और लौटना समझाता है"
        title: "आपको जो भाए, उसका घर"
        body: "किसी भी शेयर शीट से लिंक सहेजें, आसानी से दोबारा पाने के लिए नोट या टैग जोड़ें, और बाद में उसे मूल ऐप या वेबसाइट में फिर खोलें।"
      - image: /assets/screenshots/linkhq/02-library.png
        alt: "सहेजे गए लिंक की लाइब्रेरी सूची, शीर्षक, थंबनेल, स्रोत और टैग के साथ"
        title: "सब कुछ एक ही जगह सहेजा हुआ"
        body: "आपकी लाइब्रेरी हर लिंक को नए से पुराने क्रम में दिखाती है, और असली शीर्षक, थंबनेल, स्रोत और टैग वह काम करते हैं जो सादा URL कभी नहीं कर पाता।"
      - image: /assets/screenshots/linkhq/03-details.png
        alt: "प्रीव्यू इमेज, Open Original बटन और स्रोत के साथ लिंक का विवरण"
        title: "एक टैप में स्रोत तक वापसी"
        body: "हर लिंक प्रीव्यू, शीर्षक और स्रोत के साथ साफ़ विवरण दृश्य में खुलता है। Open Original पर टैप करें और iOS उसे उसी ऐप या साइट में फिर खोल देता है जहाँ से वह आया था।"
      - image: /assets/screenshots/linkhq/04-metadata.png
        alt: "जोड़ने की तारीख़, आख़िरी बार खोलने और उपलब्धता की स्थिति दिखाती लिंक जानकारी"
        title: "उसका इतिहास और स्थिति जानें"
        body: "देखें कि लिंक कब जोड़ा गया और आख़िरी बार कब खोला गया, उसे फिर से बिना खोला चिह्नित करें, और ढूँढने से पहले जाँचें कि वह अब भी उपलब्ध है या नहीं।"
      - image: /assets/screenshots/linkhq/05-favorites.png
        alt: "फ़ोटो, नोट और चालू पसंदीदा के साथ रेसिपी लिंक का विवरण"
        title: "आपके अपने नोट और पसंदीदा"
        body: "जिन लिंक पर आप बार-बार लौटते हैं उन पर स्टार लगाएँ और एक निजी नोट जोड़ें, जैसे अगले सप्ताहांत उस रात भर वाले प्रूफ़ को आज़माने की याद दिलाना।"
      - image: /assets/screenshots/linkhq/06-tags.png
        alt: "सहेजे गए लिंक के नोट, टैग और कीवर्ड के साथ व्यवस्थित करें अनुभाग"
        title: "टैग लगाएँ, बाद में पाएँ"
        body: "LinkHQ आपके डिवाइस पर जो कीवर्ड निकालता है उनके साथ अपने टैग जोड़ें, ताकि एक ही विषय के लिंक आसानी से एक साथ आ जाएँ।"
      - image: /assets/screenshots/linkhq/07-filters.png
        alt: "पसंदीदा, Unopened, Unavailable, स्रोत और कीवर्ड के साथ फ़िल्टर मेनू"
        title: "पल भर में फ़िल्टर करें"
        body: "लाइब्रेरी को पसंदीदा, बिना खोले या अनुपलब्ध लिंक तक, या किसी एक स्रोत या कीवर्ड तक सीमित करें।"
      - image: /assets/screenshots/linkhq/08-settings.png
        alt: "सहेजे गए लिंक की संख्या और Delete All Links के साथ सेटिंग स्क्रीन"
        title: "आपकी लाइब्रेरी, आपके नियंत्रण में"
        body: "सेटिंग दिखाती है कि आपने कितने लिंक सहेजे हैं और पूरी लाइब्रेरी एक साथ साफ़ करने देती है। वह केवल आपके डिवाइस पर रहती है, इसलिए पीछे कुछ नहीं बचता।"
      - image: /assets/screenshots/linkhq/09-add-link.png
        alt: "URL, वैकल्पिक शीर्षक, नोट और टैग फ़ील्ड के साथ लिंक जोड़ें फ़ॉर्म"
        title: "कोई भी लिंक हाथ से जोड़ें"
        body: "शेयर शीट से नहीं आ रहे? कोई भी URL पेस्ट करें, चाहें तो शीर्षक दें, और नोट व टैग सीधे ऐप के भीतर जोड़ें।"

nl:
  showcase:
    label: "Van dichtbij"
    title: "Een rustige bibliotheek voor alles wat je nog eens wilt zien"
    intro: "Zie hoe LinkHQ gedeelde links verandert in een doorzoekbaar archief, met echte titels, miniaturen en met één tik terug naar de bron."
    shots:
      - image: /assets/screenshots/linkhq/01-welcome.png
        alt: "Welkomstscherm van LinkHQ dat Vastleggen, Vinden en Terugkeren uitlegt"
        title: "Een thuis voor wat je raakt"
        body: "Leg een link vast vanuit elk deelmenu, voeg een notitie of tag toe zodat je hem makkelijk terugvindt, en keer er later naar terug in de oorspronkelijke app of website."
      - image: /assets/screenshots/linkhq/02-library.png
        alt: "Bibliotheeklijst met bewaarde links, met titels, miniaturen, bronnen en tags"
        title: "Alles op één plek bewaard"
        body: "Je bibliotheek toont elke link met de nieuwste bovenaan, met echte titel, miniatuur, bron en tags die doen wat een kale URL nooit kan."
      - image: /assets/screenshots/linkhq/03-details.png
        alt: "Linkdetails met een voorbeeldafbeelding, de knop Open Original en de bron"
        title: "Met één tik terug naar de bron"
        body: "Elke link opent in een overzichtelijke detailweergave met voorbeeld, titel en bron. Tik op Open Original en iOS opent hem opnieuw in de app of site waar hij vandaan kwam."
      - image: /assets/screenshots/linkhq/04-metadata.png
        alt: "Linkinfo met toevoegdatum, laatst geopend en beschikbaarheidsstatus"
        title: "Ken de geschiedenis en status"
        body: "Zie wanneer een link is toegevoegd en voor het laatst geopend, markeer hem weer als ongeopend en controleer of hij nog beschikbaar is voordat je gaat zoeken."
      - image: /assets/screenshots/linkhq/05-favorites.png
        alt: "Details van een receptlink met een foto, een notitie en Favoriet ingeschakeld"
        title: "Je eigen notities en favorieten"
        body: "Geef links waar je steeds op terugkomt een ster en voeg een persoonlijke notitie toe, zoals een herinnering om komend weekend die rijzing van een nacht te proberen."
      - image: /assets/screenshots/linkhq/06-tags.png
        alt: "Sectie Ordenen met een notitie, tags en trefwoorden voor een bewaarde link"
        title: "Geef het een tag, vind het later"
        body: "Voeg je eigen tags toe naast de trefwoorden die LinkHQ op je apparaat haalt, zodat links over hetzelfde onderwerp makkelijk weer bij elkaar komen."
      - image: /assets/screenshots/linkhq/07-filters.png
        alt: "Filtermenu met favorieten, Unopened, Unavailable, bronnen en trefwoorden"
        title: "Filter in een oogwenk"
        body: "Beperk de bibliotheek tot favoriete, ongeopende of onbeschikbare links, of tot één bron of trefwoord."
      - image: /assets/screenshots/linkhq/08-settings.png
        alt: "Instellingenscherm met het aantal bewaarde links en Delete All Links"
        title: "Je bibliotheek, onder jouw controle"
        body: "Instellingen toont hoeveel links je hebt bewaard en laat je de hele bibliotheek in één keer wissen. Ze staat alleen op je apparaat, dus er blijft niets achter."
      - image: /assets/screenshots/linkhq/09-add-link.png
        alt: "Formulier Link toevoegen met velden voor URL, optionele titel, notitie en tags"
        title: "Voeg elke link handmatig toe"
        body: "Kom je niet uit het deelmenu? Plak een willekeurige URL, geef hem eventueel een titel en voeg notitie en tags direct in de app toe."

tr:
  showcase:
    label: "Yakından bakış"
    title: "Yeniden bakmak istediğiniz her şey için sakin bir kitaplık"
    intro: "LinkHQ'nun paylaştığınız bağlantıları gerçek başlıklar, küçük resimler ve kaynağa tek dokunuşla dönüş sağlayan, aranabilir bir arşive nasıl dönüştürdüğünü görün."
    shots:
      - image: /assets/screenshots/linkhq/01-welcome.png
        alt: "Yakala, Bul ve Geri Dön adımlarını anlatan LinkHQ karşılama ekranı"
        title: "Sizi etkileyenlere bir yuva"
        body: "Herhangi bir paylaşım sayfasından bağlantı yakalayın, kolayca yeniden bulmak için not veya etiket ekleyin ve sonra özgün uygulamasında ya da sitesinde ona geri dönün."
      - image: /assets/screenshots/linkhq/02-library.png
        alt: "Başlıkları, küçük resimleri, kaynakları ve etiketleriyle kayıtlı bağlantıların kitaplık listesi"
        title: "Her şey tek bir yerde kayıtlı"
        body: "Kitaplığınız her bağlantıyı en yeniden başlayarak listeler; gerçek başlık, küçük resim, kaynak ve etiketler, çıplak bir adresin asla yapamayacağı işi görür."
      - image: /assets/screenshots/linkhq/03-details.png
        alt: "Önizleme görseli, Open Original düğmesi ve kaynakla bağlantı ayrıntıları"
        title: "Tek dokunuşla kaynağa dönüş"
        body: "Her bağlantı; önizleme, başlık ve kaynakla sade bir ayrıntı görünümünde açılır. Open Original'a dokunun; iOS onu geldiği uygulamada ya da sitede yeniden açar."
      - image: /assets/screenshots/linkhq/04-metadata.png
        alt: "Eklenme tarihini, son açılışı ve kullanılabilirlik durumunu gösteren bağlantı bilgisi"
        title: "Geçmişini ve durumunu bilin"
        body: "Bir bağlantının ne zaman eklendiğini ve en son ne zaman açıldığını görün, onu yeniden açılmadı olarak işaretleyin ve aramaya çıkmadan önce hâlâ kullanılabilir olup olmadığına bakın."
      - image: /assets/screenshots/linkhq/05-favorites.png
        alt: "Fotoğraf, not ve açık Sık Kullanılan seçeneğiyle bir tarif bağlantısının ayrıntıları"
        title: "Size özel notlar ve sık kullanılanlar"
        body: "Tekrar tekrar döndüğünüz bağlantılara yıldız verin ve gelecek hafta sonu o gece mayalamayı denemeyi hatırlatan gibi kişisel bir not ekleyin."
      - image: /assets/screenshots/linkhq/06-tags.png
        alt: "Kayıtlı bir bağlantı için not, etiket ve anahtar kelimeler içeren Düzenle bölümü"
        title: "Etiketleyin, sonra bulun"
        body: "LinkHQ'nun cihazınızda çıkardığı anahtar kelimelerin yanına kendi etiketlerinizi ekleyin; böylece aynı konudaki bağlantıları yeniden bir araya getirmek kolaylaşır."
      - image: /assets/screenshots/linkhq/07-filters.png
        alt: "Sık kullanılanlar, Unopened, Unavailable, kaynaklar ve anahtar kelimeler içeren süzgeç menüsü"
        title: "Anında süzün"
        body: "Kitaplığı sık kullanılan, açılmamış veya kullanılamayan bağlantılara ya da tek bir kaynağa veya anahtar kelimeye daraltın."
      - image: /assets/screenshots/linkhq/08-settings.png
        alt: "Kayıtlı bağlantı sayısını ve Delete All Links seçeneğini gösteren Ayarlar ekranı"
        title: "Kitaplığınız, sizin denetiminizde"
        body: "Ayarlar kaç bağlantı kaydettiğinizi gösterir ve tüm kitaplığı tek seferde temizlemenize izin verir. Kitaplık yalnızca cihazınızda durur, bu yüzden geride hiçbir şey kalmaz."
      - image: /assets/screenshots/linkhq/09-add-link.png
        alt: "Adres, isteğe bağlı başlık, not ve etiket alanlarıyla Bağlantı Ekle formu"
        title: "Herhangi bir bağlantıyı elle ekleyin"
        body: "Paylaşım sayfasından gelmiyor musunuz? Herhangi bir adresi yapıştırın, isteğe bağlı bir başlık verin ve not ile etiketleri doğrudan uygulamada ekleyin."
