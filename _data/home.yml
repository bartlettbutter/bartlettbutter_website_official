  hero_label: "Estudio independiente de software para iOS, Android y web"
  hero_title: "Diseño nítido. Experiencia fluida. Apps que merecen tu pantalla de inicio."
  hero_subtitle: "La pera Bartlett es apreciada por su mordida nítida, fresca y precisa en cada bocado. La mantequilla es lo que hace que todo se deslice, cálido y sin esfuerzo. Juntas capturan lo que buscamos en cada app: interfaces que se sienten definidas e interacciones que fluyen sin fricción."
  hero_cta_primary: "Ver Nuestro Trabajo"
  hero_cta_secondary: "Saber Más"
  works_label: "Trabajos Seleccionados"
  works_title: "Apps que hemos creado"
  works_dock_aria: "Dock de apps"
  open_app_prefix: "Abrir la página de la app"
  open_app_suffix: ""
  story_title: "Hacemos apps que te respetan"
  story_intro: "Bartlett por lo nítido. Butter por lo fluido. Creamos apps centradas en la privacidad que se sienten definidas en el diseño y sin esfuerzo en el uso. Algunas apps funcionan sin conexión, y todas respetan tus datos."
  philosophy_title: "Filosofía"
  philosophy_body: "Creemos que las mejores apps son las que se quitan de tu camino. La privacidad no es una función, es la base. Cada decisión de diseño empieza con la pregunta: ¿esto sirve a la persona que lo usa?"
  focus_title: "Enfoque"
  focus_items: ["On-Device AI", "Privacy-First", "Offline-Capable", "Beautiful UI", "Real-Time Data", "Native Performance"]
  technology_title: "Tecnología"
  technology_items: ["Swift / SwiftUI", "Core ML / Vision", "WeatherKit", "MapKit", "On-Device LLMs", "StoreKit"]
  build_label: "Cómo Construimos"
  build_title: "De la idea a tu pantalla de inicio"
  build_steps:
    - number: "01"
      title: "Empezar con un problema real"
      desc: "Cada app comienza con algo que realmente necesitamos resolver. Si no se gana un lugar en nuestras propias pantallas de inicio, no se lanza."
    - number: "02"
      title: "Diseñar hasta que desaparezca"
      desc: "Iteramos en cada pantalla hasta que la interfaz se desvanece en el fondo y solo queda la tarea. Sin desorden, sin curva de aprendizaje."
    - number: "03"
      title: "Construirla para funcionar en cualquier lugar"
      desc: "La capacidad sin conexión, la IA en el dispositivo y el rendimiento nativo no son ocurrencias tardías. Están integrados desde el primer día para que la app funcione dondequiera que estés."
    - number: "04"
      title: "Pulir el último 10%"
      desc: "Microinteracciones, accesibilidad, casos límite. Dedicamos más tiempo a los detalles que la mayoría nunca nota pero siempre siente."
  contact_label: "Contacto"
  contact_title: "Nos encantaría saber de ti"
