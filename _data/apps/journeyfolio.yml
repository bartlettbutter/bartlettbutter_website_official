# Per-app marketing data for Journeyfolio. Consumed by
# _layouts/app-journeyfolio.html via _includes/marketing/hero-gallery.html.
# The gallery is image-only, so it is defined once under `en` and every
# localized page falls back to that entry (mirrors _data/home.yml's keying by
# language code, which these files keep for when translatable data is added).
#
# Screenshots live in /assets/screenshots/journeyfolio/ (660px-wide web copies of
# the App Store mockups).

en:
  hero_gallery:
    # No label/title: this strip is purely visual and shared across all
    # languages (see the layout's en fallback), so it carries no translatable
    # copy. `alt` is a generic, per-screen accessible description.
    alt: "Journeyfolio app screen"
    shots:
      - /assets/screenshots/journeyfolio/01-welcome.png
      - /assets/screenshots/journeyfolio/02-glance.png
      - /assets/screenshots/journeyfolio/03-journeys.png
      - /assets/screenshots/journeyfolio/04-multicity.png
      - /assets/screenshots/journeyfolio/05-itinerary.png
      - /assets/screenshots/journeyfolio/06-navigation.png
      - /assets/screenshots/journeyfolio/07-flights.png
      - /assets/screenshots/journeyfolio/08-timeline.png
      - /assets/screenshots/journeyfolio/09-place.png
