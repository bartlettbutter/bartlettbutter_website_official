# Registry of which pages have full multi-language translations.
#
# For each section, list the app slugs whose pages exist in every language
# from _data/languages.yml. The shared layout only renders the language
# picker (and emits hreflang alternates) for an app listed here, so a page
# that has not been translated yet stays English-only with no dead links.
# Add a slug here only once every language file for it has been created.
#
# Section keys match the `section` the layout derives from the URL: English
# lives at the un-suffixed base (marketing /<app>/, support /<app>/support/,
# privacy /<app>/privacy/); every other language appends its code as the
# trailing segment (e.g. /<app>/support/<code>/).
marketing:
  - barkpedia
  - etfwise
  - formulens
  - huepick
  - journeyfolio
  - nekopedia
  - solcast

support:
  - barkpedia
  - etfwise
  - formulens
  - huepick
  - journeyfolio
  - nekopedia
  - solcast

privacy:
  - barkpedia
  - etfwise
  - formulens
  - huepick
  - journeyfolio
  - nekopedia
  - solcast
