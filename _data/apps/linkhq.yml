      - image: /assets/screenshots/linkhq/06-tags.png
        alt: "Sezione Organizza con nota, tag e parole chiave per un link salvato"
        title: "Taggalo, ritrovalo dopo"
        body: "Aggiungi i tuoi tag accanto alle parole chiave che LinkHQ estrae sul tuo dispositivo, così i link sullo stesso argomento si raccolgono facilmente."
      - image: /assets/screenshots/linkhq/07-filters.png
        alt: "Menu dei filtri con preferiti, Unopened, Unavailable, fonti e parole chiave"
