ru:
  showcase:
    label: "Взгляд поближе"
    title: "Вся ваша поездка — прекрасно упорядочена"
    intro: "Посмотрите, как Journeyfolio превращает разрозненные брони, скриншоты и письма в спокойный маршрут по дням."
    shots:
      - image: /assets/screenshots/journeyfolio/01-welcome.png
        alt: "Экран приветствия Journeyfolio с его главными обещаниями"
        title: "Откройте и начните планировать"
        body: "Никаких учётных записей, регистрации и настройки. С первого касания всё хранится на вашем устройстве и полностью работает офлайн, когда вы в пути."
      - image: /assets/screenshots/journeyfolio/02-glance.png
        alt: "Вкладка «Предстоящие» с планом на сегодня, текущими поездками и напоминанием"
        title: "Всё путешествие — как на ладони"
        body: "Вкладка «Предстоящие» показывает, что происходит сегодня, в какой вы поездке и что дальше, а напоминания сообщают обо всём, чего ещё не хватает до отъезда."
      - image: /assets/screenshots/journeyfolio/03-journeys.png
        alt: "Список поездок, сгруппированных по годам, с предстоящими и завершёнными"
        title: "Каждая поездка — по годам"
        body: "Предстоящие и прошедшие поездки собраны в одном списке по годам, а города, даты и число мероприятий видны ещё до того, как вы откроете поездку."
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "Поездка с несколькими пунктами назначения: Шанхай, Ханчжоу и Пекин"
        title: "Поездки по нескольким городам — это просто"
        body: "Связываете несколько городов в одну поездку? У каждого пункта назначения свои даты, мероприятия, погода и местные детали — всё в рамках одного путешествия."
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "Маршрут по Киото с прогнозом погоды, фильтрами по дням и рейсами"
        title: "Ваш маршрут — в одном месте"
        body: "Каждый пункт назначения открывается прогнозом погоды, фильтром по дням и полным расписанием — начиная с рейсов, которые доставят вас туда."
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "Разделы маршрута «Места и билеты» и «Рестораны»"
        title: "Находите любой пункт за секунды"
        body: "Мероприятия сгруппированы по понятным категориям — места, билеты, рестораны, — так что следующая остановка всегда в одной прокрутке от вас."
      - image: /assets/screenshots/journeyfolio/07-flights.png
        alt: "Редактор рейса с номером рейса, кнопкой «Проверить рейс» и сведениями о рейсе"
        title: "Рейсы — проверены и отслеживаются"
        body: "Введите номер рейса, и Journeyfolio заполнит маршрут, время и авиакомпанию, а затем будет показывать его статус в реальном времени в вашем маршруте по местному времени каждого аэропорта."
      - image: /assets/screenshots/journeyfolio/08-timeline.png
        alt: "Редактор отеля с проверенным адресом, картой и временем заезда и выезда"
        title: "Адреса, которым можно доверять"
        body: "Добавьте отель или место, и Journeyfolio сверит адрес с Apple Maps и отметит его на встроенной карте — рядом со временем заезда и выезда."
      - image: /assets/screenshots/journeyfolio/09-place.png
        alt: "Сведения о мероприятии «Бамбуковая роща Арасияма» с датой, адресом, телефоном, картой и заметками"
        title: "Каждая деталь — там, где нужно"
        body: "Каждое мероприятие держит вместе время, адрес, номер телефона, карту и ваши заметки — не нужно копаться в письмах, когда вы приедете."

