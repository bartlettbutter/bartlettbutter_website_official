ru:
  showcase:
    label: "Подробнее"
    title: "Тихая библиотека для всего, к чему вы хотите вернуться"
    intro: "Посмотрите, как LinkHQ превращает ссылки, которыми вы поделились, в архив с поиском: с настоящими заголовками, миниатюрами и возвратом к источнику одним касанием."
    shots:
      - image: /assets/screenshots/linkhq/01-welcome.png
        alt: "Экран приветствия LinkHQ с пояснением: сохранить, найти, вернуться"
        title: "Дом для того, что вас вдохновляет"
        body: "Сохраните ссылку из любого меню «Поделиться», добавьте заметку или тег, чтобы её было легко найти, и вернитесь к ней позже в исходном приложении или на сайте."
      - image: /assets/screenshots/linkhq/02-library.png
        alt: "Список библиотеки с сохранёнными ссылками, заголовками, миниатюрами, источниками и тегами"
        title: "Всё сохранено в одном месте"
        body: "В библиотеке все ссылки идут от новых к старым: настоящий заголовок, миниатюра, источник и теги делают то, что никогда не сделает голый адрес."
      - image: /assets/screenshots/linkhq/03-details.png
        alt: "Сведения о ссылке с изображением предпросмотра, кнопкой Open Original и источником"
        title: "К источнику одним касанием"
        body: "Каждая ссылка открывается в аккуратном окне сведений с предпросмотром, заголовком и источником. Коснитесь Open Original, и iOS откроет её в приложении или на сайте, откуда она пришла."
      - image: /assets/screenshots/linkhq/04-metadata.png
        alt: "Информация о ссылке: дата добавления, последнее открытие и статус доступности"
        title: "История и статус ссылки"
        body: "Смотрите, когда ссылка была добавлена и открыта в последний раз, снова отмечайте её неоткрытой и проверяйте, доступна ли она, прежде чем искать."
      - image: /assets/screenshots/linkhq/05-favorites.png
        alt: "Сведения о ссылке на рецепт с фото, заметкой и включённым пунктом «Избранное»"
        title: "Свои заметки и избранное"
        body: "Отмечайте звездой ссылки, к которым возвращаетесь снова и снова, и добавляйте личную заметку, например напоминание попробовать ночную расстойку в следующие выходные."
      - image: /assets/screenshots/linkhq/06-tags.png
        alt: "Раздел «Организация» с заметкой, тегами и ключевыми словами сохранённой ссылки"
        title: "Добавьте тег и найдите позже"
        body: "Добавляйте свои теги к ключевым словам, которые LinkHQ извлекает на вашем устройстве, чтобы ссылки на одну тему было легко собрать вместе."
      - image: /assets/screenshots/linkhq/07-filters.png
        alt: "Меню фильтров: избранное, Unopened, Unavailable, источники и ключевые слова"
        title: "Мгновенная фильтрация"
        body: "Сузьте библиотеку до избранных, неоткрытых или недоступных ссылок либо до одного источника или ключевого слова."
      - image: /assets/screenshots/linkhq/08-settings.png
        alt: "Экран настроек с числом сохранённых ссылок и кнопкой Delete All Links"
        title: "Ваша библиотека под вашим контролем"
        body: "В настройках видно, сколько ссылок вы сохранили, и можно очистить всю библиотеку сразу. Она хранится только на вашем устройстве, поэтому ничего не остаётся где-то ещё."
      - image: /assets/screenshots/linkhq/09-add-link.png
        alt: "Форма добавления ссылки с полями адреса, необязательного заголовка, заметки и тегов"
        title: "Добавьте любую ссылку вручную"
        body: "Не из меню «Поделиться»? Вставьте любой адрес, задайте необязательный заголовок и добавьте заметку и теги прямо в приложении."

