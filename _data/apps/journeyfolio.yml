# Per-app marketing data for Journeyfolio, keyed by language code (mirrors the
# convention in _data/home.yml). Consumed by _layouts/marketing.html via
# _includes/marketing/showcase.html. Each language mirrors the `en` structure;
# languages without their own entry fall back to `en` so every localized page
# still renders the showcase.
#
# Screenshots live in /assets/screenshots/journeyfolio/ (660px-wide web copies
# of the App Store mockups; the captions baked into each image are English, so
# the narratives here add explanation rather than repeat the on-image text).

en:
  hero_gallery:
    # No label/title: this strip is purely visual and shared across all
    # languages (see the layout's en fallback), so it carries no translatable
    # copy. `alt` is a generic, per-screen accessible description.
    alt: "Journeyfolio app screen"
    shots:
      - /assets/screenshots/journeyfolio/01-welcome.png
      - /assets/screenshots/journeyfolio/02-glance.png
      - /assets/screenshots/journeyfolio/03-journeys.png
      - /assets/screenshots/journeyfolio/04-multicity.png
      - /assets/screenshots/journeyfolio/05-itinerary.png
      - /assets/screenshots/journeyfolio/06-navigation.png
      - /assets/screenshots/journeyfolio/07-flights.png
      - /assets/screenshots/journeyfolio/08-timeline.png
      - /assets/screenshots/journeyfolio/09-place.png
  showcase:
    label: "A closer look"
    title: "Your whole trip, beautifully in order"
    intro: "See how Journeyfolio turns scattered bookings, screenshots, and emails into one calm, day-by-day itinerary."
    shots:
      - image: /assets/screenshots/journeyfolio/01-welcome.png
        alt: "Journeyfolio welcome screen with its Compose, Glide, and Private promises"
        title: "Open it and start planning"
        body: "No account, no sign-up, no setup. Everything lives on your device from the first tap, and it all works offline when you're on the move."
      - image: /assets/screenshots/journeyfolio/02-glance.png
        alt: "Upcoming tab showing today's plan, current trips, and a reminder"
        title: "The whole journey at a glance"
        body: "The Upcoming tab shows what's happening today, which trip you're on, and what's next, with reminders that flag anything still missing before you leave."
      - image: /assets/screenshots/journeyfolio/03-journeys.png
        alt: "Journeys list grouped by year with upcoming and completed trips"
        title: "Every trip, organized by year"
        body: "Upcoming and past journeys sit together in one list, grouped by year, with cities, dates, and activity counts visible before you even open a trip."
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "Multi-destination trip listing Shanghai, Hangzhou, and Beijing"
        title: "Multi-city trips, made simple"
        body: "Chaining several cities into one trip? Each destination gets its own dates, activities, weather, and local details, all under a single journey."
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "Kyoto itinerary with a weather forecast, day filters, and flights"
        title: "Your itinerary in one place"
        body: "Each destination opens to its forecast, a day-by-day filter, and the full schedule, starting with the flights that get you there."
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "Itinerary sections for Places & Tickets and Restaurants"
        title: "Find any plan in seconds"
        body: "Activities are grouped into clear categories like places, tickets, and restaurants, so the next stop is always a quick scroll away."
      - image: /assets/screenshots/journeyfolio/07-flights.png
        alt: "Flight editor with a flight number, Verify Flight, and flight details"
        title: "Flights, verified and tracked"
        body: "Enter a flight number and Journeyfolio fills in the route, times, and airline, then keeps its live status inside your itinerary in each airport's local time."
      - image: /assets/screenshots/journeyfolio/08-timeline.png
        alt: "Hotel editor with a verified address, map, and check-in and check-out times"
        title: "Addresses you can trust"
        body: "Add a hotel or place and Journeyfolio verifies the address against Apple Maps and pins it on an inline map, alongside your check-in and check-out times."
      - image: /assets/screenshots/journeyfolio/09-place.png
        alt: "Activity detail for Arashiyama Bamboo Grove with date, address, phone, map, and notes"
        title: "Every detail, right where you need it"
        body: "Each activity keeps its time, address, phone number, map, and your own notes together, so there's no digging through emails when you arrive."

zh-Hans:
  showcase:
    label: "近距离一览"
    title: "您的整个行程，井然有序，尽显美观"
    intro: "看看 Journeyfolio 如何将零散的预订、截图和邮件整理成一份从容的逐日行程表。"
    shots:
      - image: /assets/screenshots/journeyfolio/01-welcome.png
        alt: "Journeyfolio 欢迎屏幕，展示 Compose、Glide 和 Private 三大承诺"
        title: "打开即可开始规划"
        body: "无需账户，无需注册，无需设置。从第一次点按起，一切都存储在您的设备上，出行途中还可完全离线使用。"
      - image: /assets/screenshots/journeyfolio/02-glance.png
        alt: "“即将出发”标签页，显示今日计划、当前行程和一条提醒"
        title: "整段旅程一目了然"
        body: "“即将出发”标签页会显示今天的安排、您正在进行的行程以及接下来的计划，并通过提醒告诉您出发前还缺少什么。"
      - image: /assets/screenshots/journeyfolio/03-journeys.png
        alt: "按年份分组的旅程列表，包含即将出发和已完成的行程"
        title: "每次旅行，按年份整理"
        body: "即将出发和已完成的旅程并列在同一份列表中，按年份分组，无需打开行程就能看到城市、日期和活动数量。"
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "多目的地行程，列出上海、杭州和北京"
        title: "多城市行程，轻松搞定"
        body: "要把多座城市串联成一次行程？每个目的地都有自己的日期、活动、天气和当地详情，全部归于同一段旅程之下。"
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "京都行程表，含天气预报、日期筛选和航班"
        title: "行程，尽在一处"
        body: "每个目的地都会展开其天气预报、逐日筛选和完整日程，并从带您抵达那里的航班开始。"
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "行程表中的“地点和门票”与“餐厅”板块"
        title: "几秒钟找到任何安排"
        body: "活动被归入地点、门票和餐厅等清晰的类别，下一站只需轻轻滑动即可找到。"
      - image: /assets/screenshots/journeyfolio/07-flights.png
        alt: "航班编辑器，显示航班号、验证航班按钮和航班详情"
        title: "航班，经过验证并持续跟踪"
        body: "输入航班号，Journeyfolio 会自动填入航线、时刻和航空公司，并按各机场当地时间在您的行程表中显示其实时状态。"
      - image: /assets/screenshots/journeyfolio/08-timeline.png
        alt: "酒店编辑器，显示已验证的地址、地图以及入住和退房时间"
        title: "值得信赖的地址"
        body: "添加酒店或地点，Journeyfolio 会对照 Apple Maps 验证地址并在内嵌地图上标注，同时列出您的入住和退房时间。"
      - image: /assets/screenshots/journeyfolio/09-place.png
        alt: "岚山竹林的活动详情，含日期、地址、电话、地图和备注"
        title: "每个细节，都在您需要的地方"
        body: "每项活动都将时间、地址、电话号码、地图和您自己的备注集中在一起，到达时无需再翻找邮件。"

zh-Hant:
  showcase:
    label: "近距離一覽"
    title: "您的整個行程，井然有序，盡顯美觀"
    intro: "看看 Journeyfolio 如何將零散的預訂、截圖和郵件整理成一份從容的逐日行程表。"
    shots:
      - image: /assets/screenshots/journeyfolio/01-welcome.png
        alt: "Journeyfolio 歡迎螢幕，展示 Compose、Glide 和 Private 三大承諾"
        title: "開啟即可開始規劃"
        body: "無需賬戶，無需註冊，無需設定。從第一次點按起，一切都儲存在您的裝置上，出行途中還可完全離線使用。"
      - image: /assets/screenshots/journeyfolio/02-glance.png
        alt: "「即將出發」標籤頁，顯示今日計劃、目前行程和一則提醒"
        title: "整段旅程一目瞭然"
        body: "「即將出發」標籤頁會顯示今天的安排、您正在進行的行程以及接下來的計劃，並透過提醒告訴您出發前還缺少什麼。"
      - image: /assets/screenshots/journeyfolio/03-journeys.png
        alt: "按年份分組的旅程列表，包含即將出發和已完成的行程"
        title: "每次旅行，按年份整理"
        body: "即將出發和已完成的旅程並列在同一份列表中，按年份分組，無需開啟行程就能看到城市、日期和活動數量。"
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "多目的地行程，列出上海、杭州和北京"
        title: "多城市行程，輕鬆搞定"
        body: "要把多座城市串聯成一次行程？每個目的地都有自己的日期、活動、天氣和當地詳情，全部歸於同一段旅程之下。"
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "京都行程表，含天氣預報、日期篩選和航班"
        title: "行程，盡在一處"
        body: "每個目的地都會展開其天氣預報、逐日篩選和完整日程，並從帶您抵達那裡的航班開始。"
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "行程表中的「地點和門票」與「餐廳」板塊"
        title: "幾秒鐘找到任何安排"
        body: "活動被歸入地點、門票和餐廳等清晰的類別，下一站只需輕輕滑動即可找到。"
      - image: /assets/screenshots/journeyfolio/07-flights.png
        alt: "航班編輯器，顯示航班號、驗證航班按鈕和航班詳情"
        title: "航班，經過驗證並持續跟蹤"
        body: "輸入航班號，Journeyfolio 會自動填入航線、時刻和航空公司，並按各機場當地時間在您的行程表中顯示其實時狀態。"
      - image: /assets/screenshots/journeyfolio/08-timeline.png
        alt: "酒店編輯器，顯示已驗證的地址、地圖以及入住和退房時間"
        title: "值得信賴的地址"
        body: "新增酒店或地點，Journeyfolio 會對照 Apple Maps 驗證地址並在內嵌地圖上標註，同時列出您的入住和退房時間。"
      - image: /assets/screenshots/journeyfolio/09-place.png
        alt: "嵐山竹林的活動詳情，含日期、地址、電話、地圖和備註"
        title: "每個細節，都在您需要的地方"
        body: "每項活動都將時間、地址、電話號碼、地圖和您自己的備註集中在一起，到達時無需再翻找郵件。"

ja:
  showcase:
    label: "詳しく見る"
    title: "旅のすべてが、美しく整う"
    intro: "散らばった予約、スクリーンショット、メールを、Journeyfolio がどのように落ち着いた日ごとの旅程へと変えるかご覧ください。"
    shots:
      - image: /assets/screenshots/journeyfolio/01-welcome.png
        alt: "Compose、Glide、Private の3つの約束を掲げた Journeyfolio のウェルカム画面"
        title: "開いてすぐに計画開始"
        body: "アカウントも、登録も、設定も不要。最初のタップからすべてがあなたのデバイス上にあり、移動中もすべてオフラインで動作します。"
      - image: /assets/screenshots/journeyfolio/02-glance.png
        alt: "今日の予定、進行中の旅行、リマインダーを表示する「近日」タブ"
        title: "旅全体をひと目で"
        body: "「近日」タブでは、今日の予定、今どの旅行中か、次に何があるかがわかります。出発前にまだ足りないものはリマインダーが知らせてくれます。"
      - image: /assets/screenshots/journeyfolio/03-journeys.png
        alt: "年ごとにまとめた、これからの旅行と完了した旅行の一覧"
        title: "すべての旅を、年ごとに整理"
        body: "これからの旅も過去の旅も1つの一覧に並び、年ごとにグループ化されます。旅を開く前から、都市、日付、アクティビティ数を確認できます。"
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "上海、杭州、北京を並べた複数目的地の旅行"
        title: "複数都市の旅行も、シンプルに"
        body: "いくつもの都市を1つの旅につなげますか? 各目的地には独自の日程、アクティビティ、天気、現地情報があり、すべて1つの旅にまとまります。"
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "天気予報、日ごとのフィルター、フライトを備えた京都の旅程"
        title: "旅程が、1か所に"
        body: "各目的地を開くと、天気予報、日ごとのフィルター、そして完全なスケジュールが表示され、まず現地へ向かうフライトから始まります。"
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "「場所とチケット」と「レストラン」に分かれた旅程のセクション"
        title: "どんな予定も、数秒で見つかる"
        body: "アクティビティは場所、チケット、レストランなどの分かりやすいカテゴリーにまとめられ、次の目的地はいつでもすぐにスクロールで見つかります。"
      - image: /assets/screenshots/journeyfolio/07-flights.png
        alt: "フライト番号、フライトの検証、フライト詳細を表示するフライトエディター"
        title: "フライトを検証し、追跡"
        body: "フライト番号を入力すると、Journeyfolio が経路、時刻、航空会社を入力し、各空港の現地時間でリアルタイムの状況を旅程の中に表示し続けます。"
      - image: /assets/screenshots/journeyfolio/08-timeline.png
        alt: "検証済みの住所、地図、チェックイン・チェックアウト時刻を表示するホテルエディター"
        title: "信頼できる住所"
        body: "ホテルや場所を追加すると、Journeyfolio が Apple Maps で住所を検証し、埋め込み地図にピンを立て、チェックインとチェックアウトの時刻も並べて表示します。"
      - image: /assets/screenshots/journeyfolio/09-place.png
        alt: "日付、住所、電話番号、地図、メモを表示する嵐山の竹林のアクティビティ詳細"
        title: "あらゆる詳細を、必要な場所に"
        body: "各アクティビティは、時刻、住所、電話番号、地図、そしてあなた自身のメモをまとめて保持します。到着したときにメールを掘り返す必要はありません。"

ko:
  showcase:
    label: "자세히 보기"
    title: "여행 전체가 아름답게 정리됩니다"
    intro: "Journeyfolio가 흩어진 예약, 스크린샷, 이메일을 차분한 하루하루 일정으로 어떻게 바꾸는지 확인하세요."
    shots:
      - image: /assets/screenshots/journeyfolio/01-welcome.png
        alt: "Compose, Glide, Private 세 가지 약속을 담은 Journeyfolio 시작 화면"
        title: "열고 바로 계획 시작"
        body: "계정도, 가입도, 설정도 필요 없습니다. 첫 탭부터 모든 것이 여러분의 기기에 있으며, 이동 중에도 전부 오프라인으로 작동합니다."
      - image: /assets/screenshots/journeyfolio/02-glance.png
        alt: "오늘의 계획, 진행 중인 여행, 알림을 보여주는 예정 탭"
        title: "여정 전체를 한눈에"
        body: "예정 탭에서는 오늘 일정, 현재 어떤 여행 중인지, 다음에 무엇이 있는지를 보여주며, 출발 전에 아직 빠진 것이 있으면 알림으로 알려줍니다."
      - image: /assets/screenshots/journeyfolio/03-journeys.png
        alt: "예정된 여행과 완료된 여행이 연도별로 묶인 여정 목록"
        title: "모든 여행을, 연도별로 정리"
        body: "예정된 여정과 지난 여정이 하나의 목록에 연도별로 묶여 있어, 여행을 열기 전에도 도시, 날짜, 활동 수를 바로 확인할 수 있습니다."
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "상하이, 항저우, 베이징을 나열한 여러 목적지 여행"
        title: "여러 도시 여행도, 간단하게"
        body: "여러 도시를 하나의 여행으로 잇고 있나요? 각 목적지마다 고유한 날짜, 활동, 날씨, 현지 정보가 모두 하나의 여정 아래에 담깁니다."
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "날씨 예보, 날짜 필터, 항공편이 있는 교토 일정"
        title: "일정이, 한곳에"
        body: "각 목적지를 열면 예보, 하루하루 필터, 전체 일정이 나타나며, 그곳까지 가는 항공편부터 시작됩니다."
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "장소 및 티켓, 식당으로 나뉜 일정 섹션"
        title: "어떤 계획이든 몇 초 만에"
        body: "활동이 장소, 티켓, 식당 같은 명확한 카테고리로 묶여 있어, 다음 방문지는 언제나 스크롤 한 번이면 찾을 수 있습니다."
      - image: /assets/screenshots/journeyfolio/07-flights.png
        alt: "항공편 번호, 항공편 검증, 항공편 세부 정보가 있는 항공편 편집기"
        title: "항공편을, 검증하고 추적"
        body: "항공편 번호를 입력하면 Journeyfolio가 경로, 시간, 항공사를 채우고, 각 공항의 현지 시간으로 실시간 상태를 일정 안에 계속 표시합니다."
      - image: /assets/screenshots/journeyfolio/08-timeline.png
        alt: "검증된 주소, 지도, 체크인 및 체크아웃 시간이 있는 호텔 편집기"
        title: "믿을 수 있는 주소"
        body: "호텔이나 장소를 추가하면 Journeyfolio가 Apple Maps로 주소를 검증하고 삽입된 지도에 핀을 꽂으며, 체크인 및 체크아웃 시간도 함께 보여줍니다."
      - image: /assets/screenshots/journeyfolio/09-place.png
        alt: "날짜, 주소, 전화번호, 지도, 메모가 있는 아라시야마 대나무 숲 활동 세부 화면"
        title: "모든 세부 정보를, 필요한 바로 그곳에"
        body: "각 활동은 시간, 주소, 전화번호, 지도, 그리고 여러분의 메모를 함께 보관합니다. 도착했을 때 이메일을 뒤질 필요가 없습니다."

es:
  showcase:
    label: "Una mirada más de cerca"
    title: "Todo tu viaje, perfectamente en orden"
    intro: "Descubre cómo Journeyfolio convierte reservas dispersas, capturas de pantalla y correos en un tranquilo itinerario día a día."
    shots:
      - image: /assets/screenshots/journeyfolio/01-welcome.png
        alt: "Pantalla de bienvenida de Journeyfolio con sus promesas Compose, Glide y Private"
        title: "Ábrelo y empieza a planificar"
        body: "Sin cuenta, sin registro, sin configuración. Todo vive en tu dispositivo desde el primer toque, y funciona sin conexión cuando estás en movimiento."
      - image: /assets/screenshots/journeyfolio/02-glance.png
        alt: "Pestaña Próximos que muestra el plan de hoy, los viajes en curso y un recordatorio"
        title: "Todo el viaje de un vistazo"
        body: "La pestaña Próximos muestra lo que ocurre hoy, en qué viaje estás y qué viene después, con recordatorios que avisan de lo que aún falta antes de salir."
      - image: /assets/screenshots/journeyfolio/03-journeys.png
        alt: "Lista de viajes agrupada por año con viajes próximos y completados"
        title: "Cada viaje, organizado por año"
        body: "Los viajes próximos y pasados conviven en una sola lista, agrupados por año, con ciudades, fechas y número de actividades a la vista antes de abrir un viaje."
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "Viaje con varios destinos que enumera Shanghái, Hangzhou y Pekín"
        title: "Viajes a varias ciudades, hechos sencillos"
        body: "¿Encadenas varias ciudades en un solo viaje? Cada destino tiene sus propias fechas, actividades, clima y detalles locales, todo bajo un mismo viaje."
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "Itinerario de Kioto con pronóstico del tiempo, filtros por día y vuelos"
        title: "Tu itinerario, en un solo lugar"
        body: "Cada destino se abre con su pronóstico, un filtro día a día y el horario completo, empezando por los vuelos que te llevan hasta allí."
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "Secciones del itinerario de Lugares y entradas y Restaurantes"
        title: "Encuentra cualquier plan en segundos"
        body: "Las actividades se agrupan en categorías claras como lugares, entradas y restaurantes, así que la próxima parada siempre está a un desplazamiento de distancia."
      - image: /assets/screenshots/journeyfolio/07-flights.png
        alt: "Editor de vuelo con un número de vuelo, Verificar vuelo y detalles del vuelo"
        title: "Vuelos, verificados y con seguimiento"
        body: "Introduce un número de vuelo y Journeyfolio completa la ruta, los horarios y la aerolínea, y mantiene su estado en vivo dentro de tu itinerario en la hora local de cada aeropuerto."
      - image: /assets/screenshots/journeyfolio/08-timeline.png
        alt: "Editor de hotel con una dirección verificada, un mapa y las horas de entrada y salida"
        title: "Direcciones en las que puedes confiar"
        body: "Añade un hotel o un lugar y Journeyfolio verifica la dirección con Apple Maps y la fija en un mapa integrado, junto con tus horas de entrada y salida."
      - image: /assets/screenshots/journeyfolio/09-place.png
        alt: "Detalle de actividad del Bosque de Bambú de Arashiyama con fecha, dirección, teléfono, mapa y notas"
        title: "Cada detalle, justo donde lo necesitas"
        body: "Cada actividad mantiene juntos su hora, dirección, número de teléfono, mapa y tus propias notas, sin rebuscar entre correos cuando llegues."

fr:
  showcase:
    label: "Regardez de plus près"
    title: "Tout votre voyage, parfaitement en ordre"
    intro: "Découvrez comment Journeyfolio transforme des réservations éparpillées, des captures d'écran et des e-mails en un itinéraire serein, jour par jour."
    shots:
      - image: /assets/screenshots/journeyfolio/01-welcome.png
        alt: "Écran d'accueil de Journeyfolio avec ses promesses Compose, Glide et Private"
        title: "Ouvrez-le et commencez à planifier"
        body: "Aucun compte, aucune inscription, aucune configuration. Tout vit sur votre appareil dès la première touche, et tout fonctionne hors ligne quand vous êtes en déplacement."
      - image: /assets/screenshots/journeyfolio/02-glance.png
        alt: "Onglet À venir affichant le programme du jour, les voyages en cours et un rappel"
        title: "Tout le voyage en un coup d'œil"
        body: "L'onglet À venir montre ce qui se passe aujourd'hui, le voyage en cours et la suite, avec des rappels qui signalent ce qui manque encore avant votre départ."
      - image: /assets/screenshots/journeyfolio/03-journeys.png
        alt: "Liste des voyages regroupés par année, avec voyages à venir et terminés"
        title: "Chaque voyage, classé par année"
        body: "Les voyages à venir et passés se retrouvent dans une seule liste, regroupés par année, avec villes, dates et nombre d'activités visibles avant même d'ouvrir un voyage."
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "Voyage multi-destinations listant Shanghai, Hangzhou et Pékin"
        title: "Les voyages multi-villes, en toute simplicité"
        body: "Vous enchaînez plusieurs villes en un seul voyage ? Chaque destination a ses propres dates, activités, météo et détails locaux, le tout au sein d'un même voyage."
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "Itinéraire de Kyoto avec prévisions météo, filtres par jour et vols"
        title: "Votre itinéraire, au même endroit"
        body: "Chaque destination s'ouvre sur ses prévisions, un filtre jour par jour et le programme complet, en commençant par les vols qui vous y emmènent."
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "Sections de l'itinéraire Lieux et billets et Restaurants"
        title: "Retrouvez n'importe quel projet en quelques secondes"
        body: "Les activités sont regroupées en catégories claires comme les lieux, les billets et les restaurants, pour que la prochaine étape soit toujours à un petit défilement."
      - image: /assets/screenshots/journeyfolio/07-flights.png
        alt: "Éditeur de vol avec un numéro de vol, Vérifier le vol et les détails du vol"
        title: "Des vols vérifiés et suivis"
        body: "Saisissez un numéro de vol et Journeyfolio renseigne l'itinéraire, les horaires et la compagnie aérienne, puis suit son statut en direct dans votre itinéraire, à l'heure locale de chaque aéroport."
      - image: /assets/screenshots/journeyfolio/08-timeline.png
        alt: "Éditeur d'hôtel avec une adresse vérifiée, une carte et les heures d'arrivée et de départ"
        title: "Des adresses fiables"
        body: "Ajoutez un hôtel ou un lieu et Journeyfolio vérifie l'adresse via Apple Maps et l'épingle sur une carte intégrée, avec vos heures d'arrivée et de départ."
      - image: /assets/screenshots/journeyfolio/09-place.png
        alt: "Détail de l'activité Forêt de bambous d'Arashiyama avec date, adresse, téléphone, carte et notes"
        title: "Chaque détail, là où vous en avez besoin"
        body: "Chaque activité conserve ensemble son horaire, son adresse, son numéro de téléphone, sa carte et vos propres notes, sans fouiller vos e-mails à votre arrivée."

de:
  showcase:
    label: "Ein genauerer Blick"
    title: "Deine ganze Reise, wunderschön geordnet"
    intro: "Sieh, wie Journeyfolio verstreute Buchungen, Screenshots und E-Mails in einen ruhigen, Tag-für-Tag-Reiseplan verwandelt."
    shots:
      - image: /assets/screenshots/journeyfolio/01-welcome.png
        alt: "Journeyfolio-Willkommensbildschirm mit den Versprechen Compose, Glide und Private"
        title: "Öffnen und mit dem Planen beginnen"
        body: "Kein Konto, keine Anmeldung, keine Einrichtung. Vom ersten Tippen an lebt alles auf deinem Gerät und funktioniert offline, wenn du unterwegs bist."
      - image: /assets/screenshots/journeyfolio/02-glance.png
        alt: "Tab Anstehend mit dem heutigen Plan, laufenden Reisen und einer Erinnerung"
        title: "Die ganze Reise auf einen Blick"
        body: "Der Tab Anstehend zeigt, was heute ansteht, auf welcher Reise du gerade bist und was als Nächstes kommt, mit Erinnerungen, die dich auf alles hinweisen, was vor der Abreise noch fehlt."
      - image: /assets/screenshots/journeyfolio/03-journeys.png
        alt: "Nach Jahren gruppierte Reiseliste mit anstehenden und abgeschlossenen Reisen"
        title: "Jede Reise, nach Jahr geordnet"
        body: "Anstehende und vergangene Reisen stehen gemeinsam in einer Liste, nach Jahren gruppiert, mit Städten, Daten und Aktivitätsanzahl, noch bevor du eine Reise öffnest."
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "Reise mit mehreren Zielen, die Shanghai, Hangzhou und Peking auflistet"
        title: "Reisen durch mehrere Städte, einfach gemacht"
        body: "Du verkettest mehrere Städte zu einer Reise? Jedes Ziel erhält eigene Daten, Aktivitäten, Wetter und lokale Details, alles unter einer einzigen Reise."
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "Reiseplan für Kyoto mit Wettervorhersage, Tagesfiltern und Flügen"
        title: "Dein Reiseplan an einem Ort"
        body: "Jedes Ziel öffnet sich mit Vorhersage, Tag-für-Tag-Filter und dem vollständigen Zeitplan, beginnend mit den Flügen, die dich dorthin bringen."
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "Reiseplan-Abschnitte für Orte und Tickets sowie Restaurants"
        title: "Jeden Plan in Sekunden finden"
        body: "Aktivitäten werden in klare Kategorien wie Orte, Tickets und Restaurants gruppiert, sodass der nächste Halt immer nur einen kurzen Scroll entfernt ist."
      - image: /assets/screenshots/journeyfolio/07-flights.png
        alt: "Flugeditor mit Flugnummer, Flug verifizieren und Flugdetails"
        title: "Flüge, verifiziert und verfolgt"
        body: "Gib eine Flugnummer ein und Journeyfolio füllt Route, Zeiten und Fluggesellschaft aus und hält den Live-Status in deinem Reiseplan in der Ortszeit jedes Flughafens fest."
      - image: /assets/screenshots/journeyfolio/08-timeline.png
        alt: "Hoteleditor mit verifizierter Adresse, Karte sowie Check-in- und Check-out-Zeiten"
        title: "Adressen, denen du vertrauen kannst"
        body: "Füge ein Hotel oder einen Ort hinzu und Journeyfolio überprüft die Adresse mit Apple Maps und markiert sie auf einer eingebetteten Karte, neben deinen Check-in- und Check-out-Zeiten."
      - image: /assets/screenshots/journeyfolio/09-place.png
        alt: "Aktivitätsdetails für den Arashiyama-Bambushain mit Datum, Adresse, Telefon, Karte und Notizen"
        title: "Jedes Detail, genau dort, wo du es brauchst"
        body: "Jede Aktivität hält ihre Zeit, Adresse, Telefonnummer, Karte und deine eigenen Notizen zusammen, sodass du bei der Ankunft nicht in E-Mails wühlen musst."

