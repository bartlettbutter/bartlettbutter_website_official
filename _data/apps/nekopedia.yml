# Per-app marketing data for Nekopedia. Consumed by
# _layouts/app-nekopedia.html via _includes/marketing/hero-gallery.html.
# The gallery is image-only, so it is defined once under `en` and every
# localized page falls back to that entry (mirrors _data/home.yml's keying by
# language code, which these files keep for when translatable data is added).
#
# Screenshots live in /assets/screenshots/nekopedia/ (660px-wide web copies of
# the App Store mockups).

en:
  hero_gallery:
    # No label/title: this strip is purely visual and shared across all
    # languages (see the layout's en fallback), so it carries no translatable
    # copy. `alt` is a generic, per-screen accessible description.
    alt: "Nekopedia app screen"
    shots:
      - /assets/screenshots/nekopedia/01-welcome.png
      - /assets/screenshots/nekopedia/02-scan.png
      - /assets/screenshots/nekopedia/03-identify.png
      - /assets/screenshots/nekopedia/04-profile.png
      - /assets/screenshots/nekopedia/05-history.png
      - /assets/screenshots/nekopedia/06-favorites.png
      - /assets/screenshots/nekopedia/07-explore.png
      - /assets/screenshots/nekopedia/08-quiz.png
      - /assets/screenshots/nekopedia/09-trivia.png
