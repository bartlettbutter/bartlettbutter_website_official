        alt: "आज के पिक्स स्क्रीन, जिसमें प्रमुख सूचकांक और डिविडेंड ETF के क्यूरेटेड कार्ड कीमत, भावना और व्यय अनुपात दिखाते हैं"
        title: "सभी श्रेणियों में क्यूरेटेड पिक्स"
        body: "आज के क्यूरेटेड फंड को श्रेणी के अनुसार ब्राउज़ करें — प्रमुख सूचकांक, डिविडेंड और अन्य — हर कार्ड में कीमत, व्यय अनुपात, AUM, भावना का आकलन और सूची में शामिल होने का एक पंक्ति का कारण दिखता है।"
      - image: /assets/screenshots/etfwise/06-sector.png
        alt: "सेक्टर विवरण स्क्रीन, जिसमें टेक्नोलॉजी और बिटकॉइन व क्रिप्टो ETF कीमत और भावना के साथ सूचीबद्ध हैं"
        title: "उद्योग के अनुसार फंड खोजें"
        body: "सेक्टर, कमोडिटी और थीमैटिक ETF में गहराई से उतरें — टेक, ऊर्जा, वित्त, सोना, क्रिप्टो, AI और स्वच्छ ऊर्जा — जो उद्योग के अनुसार व्यवस्थित हैं, ताकि आप अपने नज़रिए के अनुरूप एक्सपोज़र ढूँढ सकें।"
      - image: /assets/screenshots/etfwise/07-search.png
        alt: "तत्काल खोज स्क्रीन, जो SPY क्वेरी से टिकर फ़िल्टर करके मेल खाते प्रतीक और प्रदाता दिखाती है"
        title: "450+ टिकर तुरंत खोजें"
        body: "कोई भी प्रतीक टाइप करें और सैकड़ों खोजने योग्य टिकर को नाम और प्रदाता के अनुसार फ़िल्टर करें, ताकि आपका मनचाहा फंड बस कुछ कीस्ट्रोक की दूरी पर हो।"
      - image: /assets/screenshots/etfwise/08-overview.png
        alt: "SPY की फंड अवलोकन स्क्रीन, जिसमें कीमत, व्यय अनुपात, ट्रैक किया गया सूचकांक, परिचय और शीर्ष होल्डिंग्स दिखते हैं"
        title: "एक संपूर्ण फंड प्रोफ़ाइल"
        body: "पूरे अवलोकन के लिए किसी भी ETF पर टैप करें — मौजूदा कीमत, व्यय अनुपात, वह सूचकांक जिसे वह ट्रैक करता है, फंड का सरल विवरण, और सटीक भार के साथ शीर्ष होल्डिंग्स — ताकि आप ठीक-ठीक जानें कि आपके पास क्या है।"
      - image: /assets/screenshots/etfwise/09-metrics.png
        alt: "SPY की फंड मेट्रिक्स स्क्रीन, जिसमें AUM, डिविडेंड यील्ड, ट्रेलिंग और वार्षिक रिटर्न तथा समाचार भावना दिखती है"
        title: "प्रदर्शन इतिहास और भावना"
        body: "AUM, डिविडेंड यील्ड, वर्ष-दर-तारीख और बहु-वर्षीय रिटर्न, ट्रेलिंग और वार्षिक प्रदर्शन, साथ ही सात दिन का समाचार भावना स्कोर और ताज़ा सुर्खियों के साथ और गहराई में जाएँ — सब कुछ एक ही स्क्रॉल में।"

nl:
  showcase:
    label: "Zie het in actie"
    title: "Van de briefing van vandaag tot diepgaande fondsanalyse"
    intro: "Elk scherm van ETFWise is gebouwd om de vragen van een belegger snel te beantwoorden: waar moet ik vandaag naar kijken, hoe beweegt de markt, en waaruit bestaat deze ETF eigenlijk?"
    shots:
      - image: /assets/screenshots/etfwise/01-welcome.png
        alt: "Welkomstscherm van ETFWise met dagelijks samengestelde selecties, direct onderzoek en analyse op het apparaat"
        title: "Dagelijkse selecties en onderzoek met één tik"
        body: "Open ETFWise en krijg de best verhandelde Amerikaanse ETF's, per categorie gerangschikt op beheerd vermogen en elke dag ververst. Zoek een willekeurig fonds op voor de prijs en analistenbeoordelingen, met een evenwichtige analyse die direct op je apparaat wordt gegenereerd."
      - image: /assets/screenshots/etfwise/02-briefing.png
        alt: "Scherm Briefing van vandaag met begrijpelijke opsommingspunten die de markt van de dag samenvatten"
        title: "Begin met de briefing van vandaag"
        body: "Een gedateerde marktbriefing vat de week samen in begrijpelijke taal — hoeveel gevolgde ETF's stegen of daalden, hoe de hoofdindices bewogen en welke sectoren voorop liepen of achterbleven — zodat je één keer kijkt en verder kunt met je dag."
      - image: /assets/screenshots/etfwise/03-movers.png
        alt: "Scherm Markt van vandaag met de grootste stijgers en dalers over één week"
        title: "Zie wat er beweegt"
        body: "Markt van vandaag rangschikt de grootste stijgers en dalers van de week met duidelijke procentuele veranderingen, categorielabels en fondsnamen, zodat je altijd weet waar de aandacht naartoe gaat in het ETF-landschap."
      - image: /assets/screenshots/etfwise/04-indices.png
        alt: "Scherm Hoofdindices met ETF's op de S&P 500, Nasdaq en Dow Jones en hun wekelijkse veranderingen"
        title: "Volg de hoofdindices"
        body: "Belangrijke benchmark-ETF's zijn gegroepeerd per S&P 500, Nasdaq en Dow Jones, elk met de beweging van de week, zodat het totaalbeeld van de markt in één oogopslag leesbaar blijft."
      - image: /assets/screenshots/etfwise/05-picks.png
        alt: "Scherm Selecties van vandaag met kaarten voor Hoofdindex- en Dividend-ETF's met prijs, sentiment en kostenratio"
        title: "Samengestelde selecties in alle categorieën"
        body: "Blader door de samengestelde fondsen van vandaag per categorie — Hoofdindex, Dividend en meer — waarbij elke kaart de prijs, kostenratio, beheerd vermogen, een sentimentinschatting en een reden van één regel toont waarom het fonds op de lijst staat."
      - image: /assets/screenshots/etfwise/06-sector.png
        alt: "Sectordetailscherm met Technologie- en Bitcoin- en crypto-ETF's met prijs en sentiment"
        title: "Ontdek fondsen per branche"
        body: "Duik in sector-, grondstof- en thematische ETF's — tech, energie, financiële sector, goud, crypto, AI en schone energie — geordend per branche, zodat je de blootstelling vindt die bij jouw visie past."
      - image: /assets/screenshots/etfwise/07-search.png
        alt: "Scherm Direct zoeken dat tickers filtert op de zoekopdracht SPY met overeenkomende symbolen en aanbieders"
        title: "Doorzoek direct 450+ tickers"
        body: "Typ een willekeurig symbool en filter honderden doorzoekbare tickers op naam en aanbieder, zodat het fonds dat je zoekt maar een paar toetsaanslagen verwijderd is."
      - image: /assets/screenshots/etfwise/08-overview.png
        alt: "Fondsoverzicht voor SPY met prijs, kostenratio, gevolgde index, beschrijving en belangrijkste posities"
        title: "Een volledig fondsprofiel"
        body: "Tik op een willekeurige ETF voor het volledige overzicht — actuele prijs, kostenratio, de gevolgde index, een heldere fondsbeschrijving en de belangrijkste posities met hun exacte weging — zodat je precies weet wat je bezit."
      - image: /assets/screenshots/etfwise/09-metrics.png
        alt: "Fondsstatistieken voor SPY met beheerd vermogen, dividendrendement, voortschrijdende en jaarlijkse rendementen en nieuwssentiment"
        title: "Rendementsgeschiedenis en sentiment"
        body: "Ga dieper met beheerd vermogen, dividendrendement, rendementen sinds begin dit jaar en over meerdere jaren, voortschrijdende en jaarlijkse prestaties, plus een nieuwssentimentscore over zeven dagen en de laatste koppen — alles in één keer scrollen."

tr:
  showcase:
    label: "Uygulamada görün"
    title: "Bugünün brifinginden derinlemesine fon analizine"
    intro: "ETFWise'ın her ekranı bir yatırımcının sorularını hızla yanıtlamak için tasarlandı: Bugün neye bakmalıyım, piyasa nasıl hareket ediyor ve bu ETF gerçekte nelerden oluşuyor?"
    shots:
      - image: /assets/screenshots/etfwise/01-welcome.png
        alt: "Günlük özenle seçilmiş önerileri, anlık araştırmayı ve cihaz üzerinde analizi öne çıkaran ETFWise karşılama ekranı"
        title: "Günlük öneriler ve tek dokunuşla araştırma"
        body: "ETFWise'ı açın; ABD'de işlem gören en iyi ETF'ler her kategoride yönetilen varlığa (AUM) göre sıralanmış ve her gün yenilenmiş olarak karşınızda. Fiyat ve analist derecelendirmeleri için herhangi bir fonu arayın; dengeli analiz doğrudan cihazınızda oluşturulur."
      - image: /assets/screenshots/etfwise/02-briefing.png
        alt: "Günün piyasasını sade dille madde madde özetleyen Bugünün Brifingi ekranı"
        title: "Bugünün brifingiyle başlayın"
        body: "Tarihli bir piyasa brifingi haftayı sade bir dille özetler — takip edilen ETF'lerden kaçının yükseldiğini ya da düştüğünü, ana endekslerin nasıl hareket ettiğini ve hangi sektörlerin öne geçip hangilerinin geride kaldığını — böylece bir kez göz atıp gününüze devam edebilirsiniz."
      - image: /assets/screenshots/etfwise/03-movers.png
        alt: "Bir haftanın en çok yükselenlerini ve en çok düşenlerini listeleyen Bugünün Piyasası ekranı"
        title: "Neyin hareket ettiğini görün"
        body: "Bugünün Piyasası, haftanın en çok yükselen ve düşenlerini net yüzde değişimleri, kategori etiketleri ve fon adlarıyla sıralar; böylece ETF dünyasında ilginin nereye aktığını her zaman bilirsiniz."
      - image: /assets/screenshots/etfwise/04-indices.png
        alt: "S&P 500, Nasdaq ve Dow Jones ETF'lerini haftalık değişimleriyle gruplayan Ana Endeksler ekranı"
        title: "Ana endeksleri takip edin"
        body: "Önemli gösterge ETF'leri S&P 500, Nasdaq ve Dow Jones'a göre gruplanır ve her birinin haftalık hareketi gösterilir; böylece piyasanın genel tablosu bir bakışta okunabilir kalır."
      - image: /assets/screenshots/etfwise/05-picks.png
        alt: "Fiyat, duygu analizi ve gider oranını gösteren Ana Endeks ve Temettü ETF kartlarıyla Bugünün Önerileri ekranı"
        title: "Kategoriler genelinde özenle seçilmiş öneriler"
        body: "Bugünün özenle seçilmiş fonlarına Ana Endeks, Temettü ve diğer kategorilere göre göz atın; her kart fiyatı, gider oranını, AUM'u, bir duygu değerlendirmesini ve fonun listeye neden girdiğini anlatan tek satırlık bir gerekçeyi gösterir."
      - image: /assets/screenshots/etfwise/06-sector.png
        alt: "Teknoloji ile Bitcoin ve Kripto ETF'lerini fiyat ve duygu analiziyle listeleyen sektör ayrıntı ekranı"
        title: "Fonları endüstriye göre keşfedin"
        body: "Teknoloji, enerji, finans, altın, kripto, yapay zekâ ve temiz enerji gibi sektör, emtia ve tematik ETF'lere dalın; endüstriye göre düzenlendikleri için görüşünüze uyan yatırım maruziyetini kolayca bulursunuz."
      - image: /assets/screenshots/etfwise/07-search.png
        alt: "SPY sorgusuyla sembolleri filtreleyen ve eşleşen sembolleri ve sağlayıcıları gösteren Anlık Arama ekranı"
        title: "450'den fazla sembolü anında arayın"
        body: "Herhangi bir sembol yazın ve yüzlerce aranabilir sembolü ada ve sağlayıcıya göre filtreleyin; istediğiniz fon yalnızca birkaç tuş uzağınızda."
      - image: /assets/screenshots/etfwise/08-overview.png
        alt: "SPY için fiyat, gider oranı, takip edilen endeks, açıklama ve en büyük varlıkları gösteren fon genel bakış ekranı"
        title: "Eksiksiz bir fon profili"
        body: "Tam genel bakış için herhangi bir ETF'ye dokunun — güncel fiyat, gider oranı, takip ettiği endeks, sade bir fon açıklaması ve tam ağırlıklarıyla en büyük varlıklar — böylece neye sahip olduğunuzu tam olarak bilirsiniz."
      - image: /assets/screenshots/etfwise/09-metrics.png
        alt: "SPY için AUM, temettü verimi, dönemsel ve yıllık getiriler ile haber duygu analizini gösteren fon metrikleri ekranı"
        title: "Performans geçmişi ve duygu analizi"
        body: "AUM, temettü verimi, yılbaşından bu yana ve çok yıllık getiriler, dönemsel ve yıllık performansın yanı sıra yedi günlük haber duygu skoru ve son manşetlerle daha derine inin — hepsi tek bir kaydırmada."
