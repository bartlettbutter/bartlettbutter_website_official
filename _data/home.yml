es:
  meta_title: "Bartlett Butter | Apps nítidas y fluidas para móvil y web"
  meta_description: "Bartlett Butter es un estudio de apps independiente que crea aplicaciones nítidas, fluidas y centradas en la privacidad para móvil y web."
