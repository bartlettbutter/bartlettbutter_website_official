hi:
  meta_title: "Bartlett Butter | मोबाइल और वेब के लिए स्पष्ट और सहज ऐप"
  meta_description: "Bartlett Butter एक स्वतंत्र ऐप स्टूडियो है जो मोबाइल और वेब के लिए स्पष्ट, सहज और गोपनीयता-प्रथम ऐप बनाता है।"
  og_description: "एक स्वतंत्र ऐप स्टूडियो जो मोबाइल और वेब के लिए स्पष्ट, सहज और गोपनीयता-प्रथम ऐप बनाता है।"
  skip_link: "सामग्री पर जाएँ"
  toggle_menu: "मेनू टॉगल करें"
  languages_aria: "उपलब्ध भाषाएँ"
  nav_work: "कार्य"
  nav_about: "हमारे बारे में"
  nav_contact: "संपर्क करें"
  hero_label: "स्वतंत्र iOS, Android और वेब सॉफ़्टवेयर स्टूडियो"
  hero_title: "स्पष्ट डिज़ाइन। सहज अनुभव। आपकी होम स्क्रीन के योग्य ऐप।"
  hero_subtitle: "बार्टलेट नाशपाती अपने कुरकुरे स्वाद के लिए प्रिय है, हर स्वाद में ताज़ा और सटीक। मक्खन वह है जो सब कुछ सरकाता है, गर्म और सहज। साथ मिलकर, वे उस चीज़ को दर्शाते हैं जिसका हम हर ऐप में लक्ष्य रखते हैं: ऐसे इंटरफ़ेस जो तीखे महसूस हों और ऐसी इंटरैक्शन जो बिना घर्षण के बहें।"
  hero_cta_primary: "हमारा कार्य देखें"
  hero_cta_secondary: "और जानें"
  works_label: "चयनित कार्य"
  works_title: "ऐप जो हमने बनाए"
  works_dock_aria: "ऐप डॉक"
  open_app_prefix: ""
  open_app_suffix: "ऐप पेज खोलें"
  story_title: "हम ऐसे ऐप बनाते हैं जो आपका सम्मान करते हैं"
  story_intro: "स्पष्टता के लिए Bartlett। सहजता के लिए Butter। हम गोपनीयता-प्रथम ऐप बनाते हैं जो डिज़ाइन में तीखे और उपयोग में सहज महसूस होते हैं। कुछ ऐप ऑफ़लाइन काम करते हैं, और वे सभी आपके डेटा का सम्मान करते हैं।"
  philosophy_title: "दर्शन"
  philosophy_body: "हमारा मानना है कि सबसे अच्छे ऐप वे हैं जो आपके रास्ते से हट जाते हैं। गोपनीयता एक सुविधा नहीं, बल्कि नींव है। हर डिज़ाइन निर्णय इस प्रश्न से शुरू होता है: क्या यह उस व्यक्ति की सेवा करता है जो इसका उपयोग करता है?"
  focus_title: "फोकस"
  focus_items: ["On-Device AI", "Privacy-First", "Offline-Capable", "Beautiful UI", "Real-Time Data", "Native Performance"]
  technology_title: "प्रौद्योगिकी"
  technology_items: ["Swift / SwiftUI", "Core ML / Vision", "WeatherKit", "MapKit", "On-Device LLMs", "StoreKit"]
  build_label: "हम कैसे बनाते हैं"
  build_title: "विचार से आपकी होम स्क्रीन तक"
  build_steps:
    - number: "01"
      title: "एक वास्तविक समस्या से शुरुआत करें"
      desc: "हर ऐप किसी ऐसी चीज़ से शुरू होता है जिसे हम वास्तव में हल करना चाहते हैं। यदि यह हमारी अपनी होम स्क्रीन पर जगह नहीं बनाता, तो यह जारी नहीं होता।"
    - number: "02"
      title: "तब तक डिज़ाइन करें जब तक यह गायब न हो जाए"
      desc: "हम हर स्क्रीन पर तब तक काम करते हैं जब तक इंटरफ़ेस पृष्ठभूमि में विलीन न हो जाए और केवल कार्य शेष रह जाए। कोई अव्यवस्था नहीं, कोई सीखने की अवस्था नहीं।"
    - number: "03"
      title: "इसे हर जगह काम करने के लिए बनाएँ"
      desc: "ऑफ़लाइन क्षमता, ऑन-डिवाइस AI और नेटिव प्रदर्शन बाद के विचार नहीं हैं। वे पहले दिन से ही शामिल हैं ताकि ऐप वहाँ काम करे जहाँ भी आप हों।"
    - number: "04"
      title: "अंतिम 10% को निखारें"
      desc: "माइक्रो-इंटरैक्शन, सुगम्यता, किनारे के मामले। हम उन विवरणों पर सबसे अधिक समय बिताते हैं जिन्हें अधिकांश लोग कभी नहीं देखते पर हमेशा महसूस करते हैं।"
  contact_label: "संपर्क"
  contact_title: "हम आपसे सुनना चाहेंगे"
  contact_text_line1: "कोई प्रश्न, प्रतिक्रिया या सहयोग का विचार है?"
  contact_text_line2: "कभी भी हमें संदेश भेजें।"
  footer_desc: "स्पष्टता के लिए Bartlett। सहजता के लिए Butter। एक स्वतंत्र स्टूडियो जो मोबाइल और वेब के लिए गोपनीयता-प्रथम ऐप बनाता है।"
  footer_apps_label: "हमारे ऐप"
  footer_rights: "सर्वाधिकार सुरक्षित।"
  footer_contact_link: "संपर्क"

ar:
  meta_title: "Bartlett Butter | تطبيقات واضحة وسلسة للهاتف والويب"
  meta_description: "Bartlett Butter استوديو تطبيقات مستقل يصنع تطبيقات واضحة وسلسة تضع الخصوصية أولًا للهاتف والويب."
  og_description: "استوديو تطبيقات مستقل يصنع تطبيقات واضحة وسلسة تضع الخصوصية أولًا للهاتف والويب."
  skip_link: "تخطَّ إلى المحتوى"
  toggle_menu: "تبديل القائمة"
  languages_aria: "اللغات المتاحة"
  nav_work: "أعمالنا"
  nav_about: "من نحن"
  nav_contact: "تواصل معنا"
  hero_label: "استوديو برمجيات مستقل لأنظمة iOS وAndroid والويب"
  hero_title: "تصميم واضح. تجربة سلسة. تطبيقات تستحق شاشتك الرئيسية."
  hero_subtitle: "إجاصة بارتلِت محبوبة لقضمتها المقرمشة، طازجة ودقيقة مع كل مذاق. الزبدة هي ما يجعل كل شيء ينزلق، دافئًا وبلا عناء. معًا، يجسّدان ما نسعى إليه في كل تطبيق: واجهات تبدو حادة وتفاعلات تنساب دون احتكاك."
  hero_cta_primary: "شاهد أعمالنا"
  hero_cta_secondary: "اعرف المزيد"
  works_label: "أعمال مختارة"
  works_title: "تطبيقات صنعناها"
  works_dock_aria: "شريط التطبيقات"
  open_app_prefix: "افتح صفحة تطبيق"
  open_app_suffix: ""
  story_title: "نصنع تطبيقات تحترمك"
  story_intro: "Bartlett للوضوح. Butter للسلاسة. نصنع تطبيقات تضع الخصوصية أولًا، حادة في التصميم وسهلة في الاستخدام. بعض التطبيقات تعمل دون اتصال، وكلها تحترم بياناتك."
  philosophy_title: "الفلسفة"
  philosophy_body: "نؤمن بأن أفضل التطبيقات هي التي تبتعد عن طريقك. الخصوصية ليست ميزة، بل أساس. يبدأ كل قرار تصميمي بسؤال: هل يخدم هذا الشخص الذي يستخدمه؟"
  focus_title: "التركيز"
  focus_items: ["On-Device AI", "Privacy-First", "Offline-Capable", "Beautiful UI", "Real-Time Data", "Native Performance"]
  technology_title: "التقنية"
  technology_items: ["Swift / SwiftUI", "Core ML / Vision", "WeatherKit", "MapKit", "On-Device LLMs", "StoreKit"]
  build_label: "كيف نبني"
  build_title: "من الفكرة إلى شاشتك الرئيسية"
  build_steps:
    - number: "01"
      title: "ابدأ بمشكلة حقيقية"
      desc: "يبدأ كل تطبيق بشيء نحتاج فعلًا إلى حلّه. إذا لم يكسب مكانًا على شاشاتنا الرئيسية، فلن يُطلَق."
    - number: "02"
      title: "صمّم حتى يختفي"
      desc: "نكرّر العمل على كل شاشة حتى تتلاشى الواجهة في الخلفية ولا تبقى إلا المهمة. لا فوضى ولا منحنى تعلّم."
    - number: "03"
      title: "ابنِه ليعمل في أي مكان"
      desc: "القدرة على العمل دون اتصال، والذكاء الاصطناعي على الجهاز، والأداء الأصلي ليست أفكارًا لاحقة. إنها مدمجة منذ اليوم الأول ليعمل التطبيق أينما كنت."
    - number: "04"
      title: "اصقل الـ 10٪ الأخيرة"
      desc: "التفاعلات الدقيقة، وإمكانية الوصول، والحالات الحدّية. نقضي أطول وقت في التفاصيل التي لا يلاحظها معظم الناس لكنهم يشعرون بها دائمًا."
  contact_label: "تواصل"
  contact_title: "يسعدنا أن نسمع منك"
  contact_text_line1: "هل لديك سؤال أو ملاحظة أو فكرة للتعاون؟"
  contact_text_line2: "راسلنا في أي وقت."
  footer_desc: "Bartlett للوضوح. Butter للسلاسة. استوديو مستقل يصنع تطبيقات تضع الخصوصية أولًا للهاتف والويب."
  footer_apps_label: "تطبيقاتنا"
  footer_rights: "جميع الحقوق محفوظة."
  footer_contact_link: "تواصل"

tr:
  meta_title: "Bartlett Butter | Mobil ve web için net ve akıcı uygulamalar"
  meta_description: "Bartlett Butter, mobil ve web için net, akıcı ve gizlilik öncelikli uygulamalar üreten bağımsız bir uygulama stüdyosudur."
  og_description: "Mobil ve web için net, akıcı ve gizlilik öncelikli uygulamalar üreten bağımsız bir uygulama stüdyosu."
  skip_link: "İçeriğe geç"
  toggle_menu: "Menüyü aç/kapat"
  languages_aria: "Mevcut diller"
  nav_work: "Çalışmalar"
  nav_about: "Hakkında"
  nav_contact: "İletişime Geçin"
  hero_label: "Bağımsız iOS, Android ve web yazılım stüdyosu"
  hero_title: "Net tasarım. Akıcı deneyim. Ana ekranınıza değer uygulamalar."
  hero_subtitle: "Bartlett armudu, her ısırıkta taze ve net olan çıtır dokusuyla sevilir. Tereyağı ise her şeyi sıcak ve zahmetsizce kaydıran şeydir. İkisi birlikte, her uygulamada hedeflediğimizi yansıtır: keskin hissettiren arayüzler ve sürtünmesiz akan etkileşimler."
  hero_cta_primary: "Çalışmalarımızı Görün"
  hero_cta_secondary: "Daha Fazla Bilgi"
  works_label: "Seçilmiş Çalışmalar"
  works_title: "Ürettiğimiz uygulamalar"
  works_dock_aria: "Uygulama dock'u"
  open_app_prefix: ""
  open_app_suffix: "uygulama sayfasını aç"
  story_title: "Size saygı duyan uygulamalar yapıyoruz"
  story_intro: "Netlik için Bartlett. Akıcılık için Butter. Tasarımda keskin, kullanımda zahmetsiz hissettiren gizlilik öncelikli uygulamalar üretiyoruz. Bazı uygulamalar çevrimdışı çalışır ve hepsi verilerinize saygı gösterir."
  philosophy_title: "Felsefe"
  philosophy_body: "En iyi uygulamaların, yolunuzdan çekilen uygulamalar olduğuna inanıyoruz. Gizlilik bir özellik değil, temeldir. Her tasarım kararı şu soruyla başlar: bu, onu kullanan kişiye hizmet ediyor mu?"
  focus_title: "Odak"
  focus_items: ["On-Device AI", "Privacy-First", "Offline-Capable", "Beautiful UI", "Real-Time Data", "Native Performance"]
  technology_title: "Teknoloji"
  technology_items: ["Swift / SwiftUI", "Core ML / Vision", "WeatherKit", "MapKit", "On-Device LLMs", "StoreKit"]
  build_label: "Nasıl İnşa Ediyoruz"
  build_title: "Fikirden ana ekranınıza"
  build_steps:
    - number: "01"
      title: "Gerçek bir sorunla başlayın"
      desc: "Her uygulama, gerçekten çözülmesini istediğimiz bir şeyle başlar. Kendi ana ekranlarımızda bir yer kazanamazsa, yayınlanmaz."
    - number: "02"
      title: "Kaybolana kadar tasarlayın"
      desc: "Arayüz arka plana çekilip yalnızca görev kalana kadar her ekran üzerinde yineleme yaparız. Dağınıklık yok, öğrenme eğrisi yok."
    - number: "03"
      title: "Her yerde çalışacak şekilde inşa edin"
      desc: "Çevrimdışı yetenek, cihaz üzeri yapay zeka ve yerel performans sonradan akla gelen şeyler değildir. Nerede olursanız olun uygulamanın çalışması için ilk günden itibaren yerleşiktir."
    - number: "04"
      title: "Son %10'u cilalayın"
      desc: "Mikro etkileşimler, erişilebilirlik, uç durumlar. En çok zamanı, çoğu kişinin asla fark etmediği ama her zaman hissettiği ayrıntılara harcarız."
  contact_label: "İletişim"
  contact_title: "Sizden haber almak isteriz"
  contact_text_line1: "Bir sorunuz, geri bildiriminiz veya iş birliği fikriniz mi var?"
  contact_text_line2: "İstediğiniz zaman bize yazın."
  footer_desc: "Netlik için Bartlett. Akıcılık için Butter. Mobil ve web için gizlilik öncelikli uygulamalar üreten bağımsız bir stüdyo."
  footer_apps_label: "Uygulamalarımız"
  footer_rights: "Tüm hakları saklıdır."
  footer_contact_link: "İletişim"

nl:
  meta_title: "Bartlett Butter | Heldere & vloeiende apps voor mobiel en web"
  meta_description: "Bartlett Butter is een onafhankelijke app-studio die heldere, vloeiende en privacy-eerst apps maakt voor mobiel en web."
  og_description: "Een onafhankelijke app-studio die heldere, vloeiende en privacy-eerst apps maakt voor mobiel en web."
  skip_link: "Ga naar inhoud"
  toggle_menu: "Menu wisselen"
  languages_aria: "Beschikbare talen"
  nav_work: "Werk"
  nav_about: "Over"
  nav_contact: "Neem Contact Op"
  hero_label: "Onafhankelijke iOS-, Android- en websoftwarestudio"
  hero_title: "Helder ontwerp. Vloeiende ervaring. Apps die je startscherm waard zijn."
  hero_subtitle: "De Bartlett-peer wordt geliefd om zijn knapperige beet, fris en precies bij elke hap. Boter is wat alles laat glijden, warm en moeiteloos. Samen vatten ze samen waar we in elke app naar streven: interfaces die scherp aanvoelen en interacties die zonder wrijving stromen."
  hero_cta_primary: "Bekijk Ons Werk"
  hero_cta_secondary: "Meer Informatie"
  works_label: "Geselecteerd Werk"
  works_title: "Apps die we hebben gemaakt"
  works_dock_aria: "App-dock"
  open_app_prefix: "Open de app-pagina van"
  open_app_suffix: ""
  story_title: "We maken apps die je respecteren"
  story_intro: "Bartlett voor helder. Butter voor vloeiend. We maken privacy-eerst apps die scherp aanvoelen in ontwerp en moeiteloos in gebruik. Sommige apps werken offline, en ze respecteren allemaal je gegevens."
  philosophy_title: "Filosofie"
  philosophy_body: "We geloven dat de beste apps degene zijn die uit je weg gaan. Privacy is geen functie, het is het fundament. Elke ontwerpbeslissing begint met de vraag: dient dit de persoon die het gebruikt?"
  focus_title: "Focus"
  focus_items: ["On-Device AI", "Privacy-First", "Offline-Capable", "Beautiful UI", "Real-Time Data", "Native Performance"]
  technology_title: "Technologie"
  technology_items: ["Swift / SwiftUI", "Core ML / Vision", "WeatherKit", "MapKit", "On-Device LLMs", "StoreKit"]
  build_label: "Hoe We Bouwen"
  build_title: "Van idee naar je startscherm"
  build_steps:
    - number: "01"
      title: "Begin met een echt probleem"
      desc: "Elke app begint met iets dat we echt opgelost willen zien. Als het geen plek verdient op onze eigen startschermen, wordt het niet uitgebracht."
    - number: "02"
      title: "Ontwerp tot het verdwijnt"
      desc: "We itereren op elk scherm tot de interface naar de achtergrond vervaagt en alleen de taak overblijft. Geen rommel, geen leercurve."
    - number: "03"
      title: "Bouw het om overal te werken"
      desc: "Offline-mogelijkheid, AI op het apparaat en native prestaties zijn geen bijzaken. Ze zijn vanaf dag één ingebouwd zodat de app werkt waar je ook bent."
    - number: "04"
      title: "Polijst de laatste 10%"
      desc: "Micro-interacties, toegankelijkheid, randgevallen. We besteden de meeste tijd aan de details die de meeste mensen nooit opmerken maar altijd voelen."
  contact_label: "Contact"
  contact_title: "We horen graag van je"
  contact_text_line1: "Heb je een vraag, feedback of een idee voor samenwerking?"
  contact_text_line2: "Stuur ons altijd een bericht."
  footer_desc: "Bartlett voor helder. Butter voor vloeiend. Een onafhankelijke studio die privacy-eerst apps maakt voor mobiel en web."
  footer_apps_label: "Onze Apps"
  footer_rights: "Alle rechten voorbehouden."
  footer_contact_link: "Contact"
