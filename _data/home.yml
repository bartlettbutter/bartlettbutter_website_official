en:
  meta_title: "Bartlett Butter | Crisp & Smooth Apps for Mobile and Web"
  meta_description: "Bartlett Butter is an independent app studio crafting crisp, smooth, privacy-first apps for mobile and web."
  og_description: "An independent app studio crafting crisp, smooth, privacy-first apps for mobile and web."
  skip_link: "Skip to content"
  toggle_menu: "Toggle menu"
  languages_aria: "Available languages"
  nav_work: "Work"
  nav_about: "About"
  nav_contact: "Get in Touch"
  hero_label: "Independent iOS, Android & Web Software Studio"
  hero_title: "Crisp design. Smooth experience. Apps worth your home screen."
  hero_subtitle: "The Bartlett pear is loved for its crisp bite, fresh and precise with every taste. Butter is what makes everything glide, warm and effortless. Together, they capture what we aim for in every app: interfaces that feel sharp and interactions that flow without friction."
  hero_cta_primary: "View Our Work"
  hero_cta_secondary: "Learn More"
  works_label: "Selected Works"
  works_title: "Apps we've crafted"
  works_dock_aria: "App dock"
  open_app_prefix: "Open"
  open_app_suffix: "app page"
  story_title: "We make apps that respect you"
  story_intro: "Bartlett for crisp. Butter for smooth. We craft privacy-first apps that feel sharp in design and effortless in use. Select apps work offline, and all of them respect your data."
  philosophy_title: "Philosophy"
  philosophy_body: "We believe the best apps are the ones that get out of your way. Privacy is not a feature, it is the foundation. Every design decision starts with the question: does this serve the person using it?"
  focus_title: "Focus"
  focus_items: ["On-Device AI", "Privacy-First", "Offline-Capable", "Beautiful UI", "Real-Time Data", "Native Performance"]
  technology_title: "Technology"
  technology_items: ["Swift / SwiftUI", "Core ML / Vision", "WeatherKit", "MapKit", "On-Device LLMs", "StoreKit"]
  build_label: "How We Build"
  build_title: "From idea to your home screen"
  build_steps:
    - number: "01"
      title: "Start with a real problem"
      desc: "Every app begins with something we genuinely need solved. If it does not earn a spot on our own home screens, it does not ship."
    - number: "02"
      title: "Design until it disappears"
      desc: "We iterate on every screen until the interface fades into the background and only the task remains. No clutter, no learning curve."
    - number: "03"
      title: "Build it to work anywhere"
      desc: "Offline capability, on-device AI, and native performance are not afterthoughts. They are baked in from day one so the app works wherever you are."
    - number: "04"
      title: "Polish the last 10%"
      desc: "Micro-interactions, accessibility, edge cases. We spend the most time on the details most people never notice but always feel."
  contact_label: "Contact"
  contact_title: "We'd love to hear from you"
  contact_text_line1: "Have a question, feedback, or collaboration idea?"
  contact_text_line2: "Drop us a note anytime."
  footer_desc: "Bartlett for crisp. Butter for smooth. An independent studio crafting privacy-first apps for mobile and web."
  footer_apps_label: "Our Apps"
  footer_rights: "All rights reserved."
  footer_contact_link: "Contact"

zh-Hans:
  meta_title: "Bartlett Butter | 为移动端和网页打造清新流畅的应用"
  meta_description: "Bartlett Butter是一家独立应用工作室，为移动端和网页打造清新、流畅、隐私优先的应用。"
  og_description: "一家独立应用工作室，为移动端和网页打造清新、流畅、隐私优先的应用。"
  skip_link: "跳至内容"
  toggle_menu: "切换菜单"
  languages_aria: "可用语言"
  nav_work: "作品"
  nav_about: "关于"
  nav_contact: "联系我们"
  hero_label: "独立的iOS、Android与网页软件工作室"
  hero_title: "清新的设计。流畅的体验。值得留在主屏幕的应用。"
  hero_subtitle: "巴特利梨因其清脆的口感而备受喜爱，每一口都新鲜而精准。黄油则让一切变得顺滑，温暖而毫不费力。两者结合，正体现了我们对每一款应用的追求：界面利落，交互流畅无阻。"
  hero_cta_primary: "查看我们的作品"
  hero_cta_secondary: "了解更多"
  works_label: "精选作品"
  works_title: "我们精心打造的应用"
  works_dock_aria: "应用程序坞"
  open_app_prefix: "打开"
  open_app_suffix: "应用页面"
  story_title: "我们打造尊重您的应用"
  story_intro: "Bartlett代表清新。Butter代表流畅。我们打造隐私优先的应用，设计利落，使用毫不费力。部分应用可离线使用，而所有应用都尊重您的数据。"
  philosophy_title: "理念"
  philosophy_body: "我们相信最好的应用是那些不妨碍您的应用。隐私不是一项功能，而是根基。每一个设计决策都始于一个问题：这是否服务于使用它的人？"
  focus_title: "专注"
  focus_items: ["On-Device AI", "Privacy-First", "Offline-Capable", "Beautiful UI", "Real-Time Data", "Native Performance"]
  technology_title: "技术"
  technology_items: ["Swift / SwiftUI", "Core ML / Vision", "WeatherKit", "MapKit", "On-Device LLMs", "StoreKit"]
  build_label: "我们如何打造"
  build_title: "从创意到您的主屏幕"
  build_steps:
    - number: "01"
      title: "从真实的问题出发"
      desc: "每款应用都始于我们真正需要解决的问题。如果它无法在我们自己的主屏幕上赢得一席之地，就不会发布。"
    - number: "02"
      title: "设计到它消失于无形"
      desc: "我们反复打磨每一个屏幕，直到界面隐入背景，只剩下任务本身。没有杂乱，没有学习曲线。"
    - number: "03"
      title: "打造随处可用的应用"
      desc: "离线能力、设备端AI和原生性能并非事后添加。它们从第一天起就融入其中，让应用无论您身处何地都能运作。"
    - number: "04"
      title: "打磨最后的10%"
      desc: "微交互、无障碍性、边缘情况。我们把最多的时间花在大多数人从不注意却总能感受到的细节上。"
  contact_label: "联系"
  contact_title: "我们期待您的来信"
  contact_text_line1: "有问题、反馈或合作想法？"
  contact_text_line2: "随时给我们留言。"
  footer_desc: "Bartlett代表清新。Butter代表流畅。一家为移动端和网页打造隐私优先应用的独立工作室。"
  footer_apps_label: "我们的应用"
  footer_rights: "版权所有。"
  footer_contact_link: "联系"

