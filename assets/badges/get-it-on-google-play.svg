<svg xmlns="http://www.w3.org/2000/svg" width="140" height="40" viewBox="0 0 140 40" role="img" aria-label="Get it on Google Play">
  <title>Get it on Google Play</title>
  <rect x="0.5" y="0.5" width="139" height="39" rx="6.5" ry="6.5" fill="#000000" stroke="#A6A6A6" stroke-width="1"/>
  <!-- Google Play triangle: silhouette A(top)-B(bottom)-T(tip), folded at F(center) -->
  <g transform="translate(11,8)">
    <path d="M3,2.5 L3,12 L12,12 Z" fill="#4285F4"/>
    <path d="M3,12 L3,21.5 L12,12 Z" fill="#34A853"/>
    <path d="M3,2.5 L12,12 L20,12 Z" fill="#EA4335"/>
    <path d="M3,21.5 L12,12 L20,12 Z" fill="#FBBC04"/>
  </g>
  <text x="45" y="16" fill="#FFFFFF" font-family="'Inter Tight', Arial, sans-serif" font-size="7" letter-spacing="1.5">GET IT ON</text>
  <text x="44.5" y="32" fill="#FFFFFF" font-family="'Inter Tight', Arial, sans-serif" font-size="15" font-weight="500">Google Play</text>
</svg>
