# Per-app marketing data for ETFWise. Consumed by
# _layouts/app-etfwise.html via _includes/marketing/hero-gallery.html.
# The gallery is image-only, so it is defined once under `en` and every
# localized page falls back to that entry (mirrors _data/home.yml's keying by
# language code, which these files keep for when translatable data is added).
#
# Screenshots live in /assets/screenshots/etfwise/ (660px-wide web copies of
# the App Store mockups).

en:
  hero_gallery:
    # No label/title: this strip is purely visual and shared across all
    # languages (see the layout's en fallback), so it carries no translatable
    # copy. `alt` is a generic, per-screen accessible description.
    alt: "ETFWise app screen"
    shots:
      - /assets/screenshots/etfwise/01-welcome.png
      - /assets/screenshots/etfwise/02-briefing.png
      - /assets/screenshots/etfwise/03-movers.png
      - /assets/screenshots/etfwise/04-indices.png
      - /assets/screenshots/etfwise/05-picks.png
      - /assets/screenshots/etfwise/06-sector.png
      - /assets/screenshots/etfwise/07-search.png
      - /assets/screenshots/etfwise/08-overview.png
      - /assets/screenshots/etfwise/09-metrics.png
