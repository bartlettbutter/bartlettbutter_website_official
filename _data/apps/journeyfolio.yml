        alt: "تبويب القادمة يعرض خطة اليوم والرحلات الجارية وتذكيرًا"
        title: "الرحلة كاملة في لمحة"
        body: "يعرض تبويب القادمة ما يحدث اليوم، وأي رحلة أنت فيها، وما يأتي بعد ذلك، مع تذكيرات تنبّهك إلى كل ما لا يزال ناقصًا قبل مغادرتك."
      - image: /assets/screenshots/journeyfolio/03-journeys.png
        alt: "قائمة الرحلات مجمّعة حسب السنة مع رحلات قادمة ومكتملة"
        title: "كل رحلة، منظّمة حسب السنة"
        body: "تجتمع الرحلات القادمة والسابقة في قائمة واحدة مجمّعة حسب السنة، مع إظهار المدن والتواريخ وعدد الأنشطة قبل أن تفتح الرحلة."
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "رحلة متعددة الوجهات تضم شانغهاي وهانغتشو وبكين"
        title: "رحلات متعددة المدن، بكل بساطة"
        body: "هل تربط عدة مدن في رحلة واحدة؟ تحصل كل وجهة على تواريخها وأنشطتها وطقسها وتفاصيلها المحلية الخاصة، وكل ذلك ضمن رحلة واحدة."
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "مسار كيوتو مع توقعات الطقس ومرشّحات الأيام والرحلات الجوية"
        title: "مسارك في مكان واحد"
        body: "تُفتح كل وجهة على توقعات الطقس ومرشّح يوم بيوم والجدول الكامل، بدءًا بالرحلات الجوية التي توصلك إليها."
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "أقسام المسار: الأماكن والتذاكر والمطاعم"
        title: "اعثر على أي خطة في ثوانٍ"
        body: "تُجمَّع الأنشطة في فئات واضحة مثل الأماكن والتذاكر والمطاعم، فتكون المحطة التالية دائمًا على بُعد تمريرة سريعة."
      - image: /assets/screenshots/journeyfolio/07-flights.png
        alt: "محرّر الرحلة الجوية مع رقم الرحلة وزر التحقق من الرحلة وتفاصيلها"
        title: "رحلات جوية، مُتحقَّق منها ومُتتبَّعة"
        body: "أدخل رقم رحلة ويملأ Journeyfolio المسار والأوقات وشركة الطيران، ثم يُبقي حالتها المباشرة داخل مسارك بالتوقيت المحلي لكل مطار."
      - image: /assets/screenshots/journeyfolio/08-timeline.png
        alt: "محرّر الفندق مع عنوان مُتحقَّق منه وخريطة وأوقات تسجيل الوصول والمغادرة"
        title: "عناوين يمكنك الوثوق بها"
        body: "أضف فندقًا أو مكانًا ويتحقّق Journeyfolio من العنوان عبر Apple Maps ويثبّته على خريطة مدمجة، إلى جانب أوقات تسجيل الوصول والمغادرة."
      - image: /assets/screenshots/journeyfolio/09-place.png
        alt: "تفاصيل نشاط غابة الخيزران في أراشياما مع التاريخ والعنوان والهاتف والخريطة والملاحظات"
        title: "كل تفصيل، في المكان الذي تحتاجه"
        body: "يحتفظ كل نشاط بوقته وعنوانه ورقم هاتفه وخريطته وملاحظاتك الخاصة معًا، فلا حاجة للبحث في الرسائل الإلكترونية عند وصولك."

hi:
  showcase:
    label: "करीब से एक नज़र"
    title: "आपकी पूरी यात्रा, खूबसूरती से व्यवस्थित"
    intro: "देखें कि Journeyfolio कैसे बिखरी हुई बुकिंग, स्क्रीनशॉट और ईमेल को एक शांत, दिन-प्रतिदिन यात्रा-कार्यक्रम में बदल देता है।"
    shots:
      - image: /assets/screenshots/journeyfolio/01-welcome.png
        alt: "Journeyfolio की स्वागत स्क्रीन, जिसमें उसके मुख्य वादे दिखते हैं"
        title: "इसे खोलें और योजना बनाना शुरू करें"
        body: "कोई खाता नहीं, कोई साइन-अप नहीं, कोई सेटअप नहीं। पहले टैप से ही सब कुछ आपके डिवाइस पर रहता है, और चलते-फिरते यह सब ऑफ़लाइन काम करता है।"
      - image: /assets/screenshots/journeyfolio/02-glance.png
        alt: "आगामी टैब, जिसमें आज की योजना, चल रही यात्राएँ और एक रिमाइंडर दिख रहे हैं"
        title: "पूरी यात्रा, एक नज़र में"
        body: "आगामी टैब दिखाता है कि आज क्या हो रहा है, आप किस यात्रा में हैं और आगे क्या है, साथ ही रिमाइंडर बताते हैं कि रवाना होने से पहले अभी क्या बाकी है।"
      - image: /assets/screenshots/journeyfolio/03-journeys.png
        alt: "वर्ष के अनुसार समूहबद्ध यात्राओं की सूची, जिसमें आगामी और पूरी हो चुकी यात्राएँ हैं"
        title: "हर यात्रा, वर्ष के अनुसार व्यवस्थित"
        body: "आगामी और पिछली यात्राएँ एक ही सूची में वर्ष के अनुसार साथ रहती हैं, और यात्रा खोलने से पहले ही शहर, तारीखें और गतिविधियों की संख्या दिख जाती है।"
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "शंघाई, हांगझोउ और बीजिंग की सूची वाली बहु-गंतव्य यात्रा"
        title: "बहु-शहर यात्राएँ, सरल बनाई गईं"
        body: "कई शहरों को एक यात्रा में जोड़ रहे हैं? प्रत्येक गंतव्य को अपनी तारीखें, गतिविधियाँ, मौसम और स्थानीय विवरण मिलते हैं, सभी एक ही यात्रा के तहत।"
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "मौसम पूर्वानुमान, दिन फ़िल्टर और उड़ानों के साथ क्योटो का यात्रा-कार्यक्रम"
        title: "आपका यात्रा-कार्यक्रम, एक ही जगह"
        body: "हर गंतव्य मौसम पूर्वानुमान, दिन-प्रतिदिन फ़िल्टर और पूरे कार्यक्रम के साथ खुलता है, जिसकी शुरुआत उन उड़ानों से होती है जो आपको वहाँ पहुँचाती हैं।"
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "स्थान और टिकट तथा रेस्तरां के यात्रा-कार्यक्रम अनुभाग"
        title: "कोई भी योजना सेकंडों में खोजें"
        body: "गतिविधियाँ स्थान, टिकट और रेस्तरां जैसी स्पष्ट श्रेणियों में समूहबद्ध होती हैं, इसलिए अगला पड़ाव हमेशा बस एक स्क्रॉल की दूरी पर रहता है।"
      - image: /assets/screenshots/journeyfolio/07-flights.png
        alt: "उड़ान संख्या, उड़ान सत्यापित करें और उड़ान विवरण वाला उड़ान संपादक"
        title: "उड़ानें, सत्यापित और ट्रैक की गईं"
        body: "एक उड़ान संख्या दर्ज करें और Journeyfolio मार्ग, समय और एयरलाइन भर देता है, फिर प्रत्येक हवाई अड्डे के स्थानीय समय में इसकी लाइव स्थिति को आपके यात्रा-कार्यक्रम में बनाए रखता है।"
      - image: /assets/screenshots/journeyfolio/08-timeline.png
        alt: "सत्यापित पते, मानचित्र और चेक-इन व चेक-आउट समय वाला होटल संपादक"
        title: "ऐसे पते जिन पर आप भरोसा कर सकते हैं"
        body: "कोई होटल या स्थान जोड़ें और Journeyfolio Apple Maps के विरुद्ध पते को सत्यापित करता है और इसे एम्बेडेड मानचित्र पर पिन करता है, साथ में आपके चेक-इन और चेक-आउट समय भी रहते हैं।"
      - image: /assets/screenshots/journeyfolio/09-place.png
        alt: "अरशियामा बांस वन गतिविधि का विवरण, जिसमें तारीख, पता, फ़ोन, मानचित्र और नोट्स हैं"
        title: "हर विवरण, ठीक वहीं जहाँ आपको चाहिए"
        body: "प्रत्येक गतिविधि अपना समय, पता, फ़ोन नंबर, मानचित्र और आपके अपने नोट्स एक साथ रखती है — पहुँचने पर ईमेल खंगालने की ज़रूरत नहीं।"

nl:
  showcase:
    label: "Een nadere blik"
    title: "Je hele reis, prachtig op orde"
    intro: "Ontdek hoe Journeyfolio verspreide boekingen, screenshots en e-mails omzet in één rustig, dag-voor-dag reisschema."
    shots:
      - image: /assets/screenshots/journeyfolio/01-welcome.png
        alt: "Welkomstscherm van Journeyfolio met de belangrijkste beloftes"
        title: "Open het en begin met plannen"
        body: "Geen account, geen aanmelding, geen installatie. Vanaf de eerste tik leeft alles op je apparaat, en het werkt allemaal offline wanneer je onderweg bent."
      - image: /assets/screenshots/journeyfolio/02-glance.png
        alt: "Tabblad Aankomend met het plan van vandaag, lopende reizen en een herinnering"
        title: "De hele reis in één oogopslag"
        body: "Het tabblad Aankomend laat zien wat er vandaag gebeurt, op welke reis je zit en wat er daarna komt, met herinneringen die aangeven wat er voor vertrek nog ontbreekt."
      - image: /assets/screenshots/journeyfolio/03-journeys.png
        alt: "Reizenlijst gegroepeerd per jaar met aankomende en afgeronde reizen"
        title: "Elke reis, geordend per jaar"
        body: "Aankomende en afgelopen reizen staan samen in één lijst, gegroepeerd per jaar, met steden, data en aantal activiteiten in beeld voordat je een reis opent."
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "Reis met meerdere bestemmingen: Shanghai, Hangzhou en Peking"
        title: "Reizen naar meerdere steden, eenvoudig gemaakt"
        body: "Rijg je meerdere steden aaneen tot één reis? Elke bestemming krijgt zijn eigen data, activiteiten, weer en lokale details, allemaal onder één reis."
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "Reisschema voor Kyoto met weersverwachting, dagfilters en vluchten"
        title: "Je reisschema op één plek"
        body: "Elke bestemming opent met de weersverwachting, een dag-voor-dag-filter en het volledige schema, te beginnen met de vluchten die je er brengen."
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "Reisschemasecties Plekken en tickets en Restaurants"
        title: "Vind elk plan in een paar seconden"
        body: "Activiteiten zijn gegroepeerd in duidelijke categorieën zoals plekken, tickets en restaurants, zodat de volgende stop altijd één scrollbeweging verderop ligt."
      - image: /assets/screenshots/journeyfolio/07-flights.png
        alt: "Vluchteditor met een vluchtnummer, Vlucht verifiëren en vluchtdetails"
        title: "Vluchten, geverifieerd en gevolgd"
        body: "Voer een vluchtnummer in en Journeyfolio vult de route, tijden en luchtvaartmaatschappij in, en houdt de live status in je reisschema bij in de lokale tijd van elke luchthaven."
      - image: /assets/screenshots/journeyfolio/08-timeline.png
        alt: "Hoteleditor met een geverifieerd adres, kaart en in- en uitchecktijden"
        title: "Adressen die je kunt vertrouwen"
        body: "Voeg een hotel of plek toe en Journeyfolio verifieert het adres met Apple Maps en zet het op een ingesloten kaart, naast je in- en uitchecktijden."
      - image: /assets/screenshots/journeyfolio/09-place.png
        alt: "Activiteitdetails voor het Arashiyama-bamboebos met datum, adres, telefoon, kaart en notities"
        title: "Elk detail, precies waar je het nodig hebt"
        body: "Elke activiteit houdt zijn tijd, adres, telefoonnummer, kaart en je eigen notities bij elkaar, zodat je bij aankomst niet in e-mails hoeft te spitten."

tr:
  showcase:
    label: "Daha yakından bir bakış"
    title: "Tüm geziniz, güzelce düzenlenmiş"
    intro: "Journeyfolio'nun dağınık rezervasyonları, ekran görüntülerini ve e-postaları nasıl sakin, gün gün bir güzergâha dönüştürdüğünü görün."
    shots:
      - image: /assets/screenshots/journeyfolio/01-welcome.png
        alt: "Journeyfolio'nun ana vaatlerini gösteren karşılama ekranı"
        title: "Açın ve planlamaya başlayın"
        body: "Hesap yok, kayıt yok, kurulum yok. İlk dokunuştan itibaren her şey cihazınızda bulunur ve yoldayken tamamen çevrimdışı çalışır."
      - image: /assets/screenshots/journeyfolio/02-glance.png
        alt: "Bugünün planını, devam eden gezileri ve bir hatırlatıcıyı gösteren Yaklaşan sekmesi"
        title: "Tüm yolculuk tek bakışta"
        body: "Yaklaşan sekmesi bugün neler olduğunu, hangi gezide olduğunuzu ve sırada ne olduğunu gösterir; hatırlatıcılar ise yola çıkmadan önce eksik kalan her şeyi işaretler."
      - image: /assets/screenshots/journeyfolio/03-journeys.png
        alt: "Yıllara göre gruplanmış, yaklaşan ve tamamlanan gezileri içeren gezi listesi"
        title: "Her gezi, yıllara göre düzenli"
        body: "Yaklaşan ve geçmiş geziler yıllara göre gruplanmış tek bir listede bir arada durur; bir geziyi açmadan önce bile şehirleri, tarihleri ve etkinlik sayıları görünür."
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "Şanghay, Hangzhou ve Pekin'i listeleyen çok hedefli gezi"
        title: "Çok şehirli geziler, basitleştirildi"
        body: "Birkaç şehri tek bir geziye mi bağlıyorsunuz? Her hedef kendi tarihlerine, etkinliklerine, hava durumuna ve yerel ayrıntılarına sahip olur; hepsi tek bir yolculuk altında."
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "Hava tahmini, gün filtreleri ve uçuşlarla Kyoto güzergâhı"
        title: "Güzergâhınız tek bir yerde"
        body: "Her hedef; hava tahmini, gün gün filtre ve tam programla açılır, en başta da sizi oraya götüren uçuşlar yer alır."
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "Yerler ve Biletler ile Restoranlar güzergâh bölümleri"
        title: "Her planı saniyeler içinde bulun"
        body: "Etkinlikler yerler, biletler ve restoranlar gibi net kategorilerde gruplanır; böylece bir sonraki durak her zaman kısa bir kaydırma uzağınızdadır."
      - image: /assets/screenshots/journeyfolio/07-flights.png
        alt: "Uçuş numarası, Uçuşu Doğrula ve uçuş ayrıntılarını içeren uçuş düzenleyici"
        title: "Uçuşlar, doğrulanmış ve takip edilmiş"
        body: "Bir uçuş numarası girin; Journeyfolio rotayı, saatleri ve havayolunu doldurur, ardından canlı durumunu her havaalanının yerel saatinde güzergâhınızın içinde tutar."
      - image: /assets/screenshots/journeyfolio/08-timeline.png
        alt: "Doğrulanmış adres, harita ile giriş ve çıkış saatlerini içeren otel düzenleyici"
        title: "Güvenebileceğiniz adresler"
        body: "Bir otel veya yer ekleyin; Journeyfolio adresi Apple Maps ile doğrular ve gömülü bir haritada işaretler, giriş ve çıkış saatlerinizle birlikte."
      - image: /assets/screenshots/journeyfolio/09-place.png
        alt: "Arashiyama Bambu Ormanı etkinliğinin tarih, adres, telefon, harita ve notlarını içeren ayrıntıları"
        title: "Her ayrıntı, tam ihtiyacınız olan yerde"
        body: "Her etkinlik saatini, adresini, telefon numarasını, haritasını ve kendi notlarınızı bir arada tutar; vardığınızda e-postaları karıştırmanıza gerek kalmaz."
