# Per-app marketing data for Solcast. Consumed by
# _layouts/app-solcast.html via _includes/marketing/hero-gallery.html.
# The gallery is image-only, so it is defined once under `en` and every
# localized page falls back to that entry (mirrors _data/home.yml's keying by
# language code, which these files keep for when translatable data is added).
#
# Screenshots live in /assets/screenshots/solcast/ (660px-wide web copies of
# the App Store mockups).

en:
  hero_gallery:
    # No label/title: this strip is purely visual and shared across all
    # languages (see the layout's en fallback), so it carries no translatable
    # copy. `alt` is a generic, per-screen accessible description.
    alt: "Solcast app screen"
    shots:
      - /assets/screenshots/solcast/hero/01.png
      - /assets/screenshots/solcast/hero/02.png
      - /assets/screenshots/solcast/hero/03.png
      - /assets/screenshots/solcast/hero/04.png
      - /assets/screenshots/solcast/hero/05.png
      - /assets/screenshots/solcast/hero/06.png
