# Per-app marketing data for TrafficVibe, keyed by language code (mirrors the
# convention in _data/home.yml and _data/apps/etfwise.yml). Consumed by
# _layouts/app-trafficvibe.html via _includes/marketing/showcase.html and
# hero-gallery.html.
#
# Real screenshots are not ready yet. The hero_gallery below points at SVG
# PLACEHOLDER frames under /assets/screenshots/trafficvibe/hero/ so the hero
# strip renders in the app palette instead of leaving a gap. When the real
# 660px-wide web copies of the App Store mockups are ready, drop them in as
# 01.png, 02.png, … and swap the `shots` paths below (and uncomment `showcase`).
#
# Each language mirrors the `en` structure; languages without their own entry
# fall back to `en`.

en:
  hero_gallery:
    # No label/title: this strip is purely visual and shared across all
    # languages, so it carries no translatable copy. `alt` is a generic,
    # per-screen accessible description.
    alt: "TrafficVibe screenshot placeholder"
    shots:
      - /assets/screenshots/trafficvibe/hero/placeholder-01.svg
      - /assets/screenshots/trafficvibe/hero/placeholder-02.svg
      - /assets/screenshots/trafficvibe/hero/placeholder-03.svg
      - /assets/screenshots/trafficvibe/hero/placeholder-01.svg
      - /assets/screenshots/trafficvibe/hero/placeholder-02.svg
