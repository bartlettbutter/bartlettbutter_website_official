      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "Editor de atividade com um endereço verificado e um mapa incorporado"
        title: "Endereços em que você pode confiar"
        body: "Adicione um lugar e o Journeyfolio verifica o endereço no Apple Maps e o fixa em um mapa incorporado, para que chegar lá esteja a um toque de distância quando você chegar."
      - image: /assets/screenshots/journeyfolio/07-timelines.png
        alt: "Tela de detalhes da atividade de um espetáculo com data, endereço, telefone e mapa"
        title: "Cada detalhe, exatamente onde você precisa"
        body: "Cada atividade mantém juntos seu horário, local, número de telefone, mapa e suas próprias notas — sem vasculhar e-mails para encontrar a confirmação."
      - image: /assets/screenshots/journeyfolio/08-flights.png
        alt: "Editor de voo mostrando uma rota verificada, horários e companhia aérea"
        title: "Voos, verificados e rastreados"
        body: "Insira um número de voo e o Journeyfolio preenche a rota, os horários e a companhia aérea, e mantém seu status ao vivo dentro do seu itinerário no horário local de cada aeroporto."

ru:
  showcase:
    label: "Взгляд поближе"
    title: "Вся ваша поездка — прекрасно упорядочена"
    intro: "Посмотрите, как Journeyfolio превращает разрозненные брони, скриншоты и письма в спокойный маршрут по дням."
    shots:
      - image: /assets/screenshots/journeyfolio/01-welcome.png
        alt: "Экран приветствия Journeyfolio с перечислением его ключевых обещаний"
        title: "Откройте и начните планировать"
        body: "Никаких учётных записей, регистрации и настройки. С первого касания всё хранится на вашем устройстве и полностью работает офлайн, когда вы в пути."
      - image: /assets/screenshots/journeyfolio/02-glance.png
        alt: "Обзор поездки с погодой, выбором дня и карточками рейсов"
        title: "Всё путешествие с одного взгляда"
        body: "Актуальная погода, выбор по дням и ваши рейсы собраны на одном экране, так что форма поездки ясна с момента открытия."
      - image: /assets/screenshots/journeyfolio/03-daily.png
        alt: "Маршрут, сгруппированный по разделам «Отель», «Транспорт» и «Места и билеты»"
        title: "Упорядочено по дням, отсортировано по типу"
        body: "Рейсы, отели, транспорт, рестораны, билеты и заметки сгруппированы в понятные категории и разложены по дням, чтобы ничего не ускользнуло."
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "Поездка с несколькими пунктами назначения: Сан-Франциско, Лос-Анджелес и Лас-Вегас"
        title: "Поездки по нескольким городам — это просто"
        body: "Связываете несколько городов в одну поездку? У каждого пункта назначения свои даты, мероприятия, погода и местные детали — всё в рамках одного путешествия."
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "Маршрут для одного пункта назначения — Лас-Вегаса — с погодой и мероприятиями"
        title: "У каждой остановки — свой маршрут"
        body: "Откройте любой пункт назначения, чтобы увидеть прогноз, фильтры по дням и полное расписание — тот же понятный вид, будь то первый город или пятый."
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "Редактор мероприятия с проверенным адресом и встроенной картой"
        title: "Адреса, которым можно доверять"
        body: "Добавьте место, и Journeyfolio сверит адрес с Apple Maps и отметит его на встроенной карте, так что по прибытии добраться туда можно одним касанием."
      - image: /assets/screenshots/journeyfolio/07-timelines.png
        alt: "Экран сведений о мероприятии для шоу с датой, адресом, телефоном и картой"
        title: "Каждая деталь — там, где нужно"
        body: "Каждое мероприятие держит вместе время, место, номер телефона, карту и ваши заметки — не нужно копаться в письмах в поисках подтверждения."
      - image: /assets/screenshots/journeyfolio/08-flights.png
        alt: "Редактор рейса с проверенным маршрутом, временем и авиакомпанией"
        title: "Рейсы — проверены и отслеживаются"
        body: "Введите номер рейса, и Journeyfolio заполнит маршрут, время и авиакомпанию, а затем будет показывать его статус в реальном времени в вашем маршруте по местному времени каждого аэропорта."

ar:
  showcase:
    label: "نظرة أقرب"
    title: "رحلتك بالكامل، منظّمة بشكل جميل"
    intro: "شاهد كيف يحوّل Journeyfolio الحجوزات المبعثرة ولقطات الشاشة والرسائل الإلكترونية إلى مسار هادئ يومًا بيوم."
    shots:
      - image: /assets/screenshots/journeyfolio/01-welcome.png
        alt: "شاشة ترحيب Journeyfolio التي تسرد وعوده الأساسية"
        title: "افتحه وابدأ التخطيط"
        body: "لا حساب، ولا تسجيل، ولا إعداد. كل شيء موجود على جهازك منذ أول نقرة، ويعمل بالكامل دون اتصال عندما تكون في الطريق."
      - image: /assets/screenshots/journeyfolio/02-glance.png
        alt: "نظرة عامة على الرحلة تعرض الطقس ومحدّد الأيام وبطاقات الرحلات الجوية"
        title: "الرحلة كلها في لمحة"
        body: "الطقس المباشر، ومحدّد يومًا بيوم، ورحلاتك الجوية تجتمع على شاشة واحدة، فيتّضح شكل رحلتك لحظة فتحه."
      - image: /assets/screenshots/journeyfolio/03-daily.png
        alt: "مسار مقسّم إلى أقسام الفندق والمواصلات والأماكن والتذاكر"
        title: "منظّم حسب اليوم، مرتّب حسب النوع"
        body: "الرحلات الجوية والفنادق والمواصلات والمطاعم والتذاكر والملاحظات مجمّعة في فئات واضحة ومرتّبة يومًا بيوم، حتى لا يفوتك شيء."
      - image: /assets/screenshots/journeyfolio/04-multicity.png
        alt: "رحلة متعددة الوجهات تسرد سان فرانسيسكو ولوس أنجلوس ولاس فيغاس"
        title: "رحلات متعددة المدن، بكل بساطة"
        body: "هل تربط عدة مدن في رحلة واحدة؟ تحصل كل وجهة على تواريخها وأنشطتها وطقسها وتفاصيلها المحلية الخاصة، وكل ذلك ضمن رحلة واحدة."
      - image: /assets/screenshots/journeyfolio/05-itinerary.png
        alt: "مسار لوجهة واحدة في لاس فيغاس مع الطقس والأنشطة"
        title: "كل محطة، ولها مسارها الخاص"
        body: "تعمّق في أي وجهة لرؤية توقّعاتها ومرشّحات الأيام والجدول الكامل — العرض الواضح نفسه، سواء كانت مدينتك الأولى أو الخامسة."
      - image: /assets/screenshots/journeyfolio/06-navigation.png
        alt: "محرّر النشاط مع عنوان مُتحقَّق منه وخريطة مدمجة"
        title: "عناوين يمكنك الوثوق بها"
        body: "أضف مكانًا ويتحقّق Journeyfolio من العنوان عبر Apple Maps ويثبّته على خريطة مدمجة، فيصبح الوصول إليه على بُعد نقرة واحدة عند وصولك."
      - image: /assets/screenshots/journeyfolio/07-timelines.png
        alt: "شاشة تفاصيل النشاط لعرض مع التاريخ والعنوان والهاتف والخريطة"
        title: "كل تفصيل، في المكان الذي تحتاجه"
        body: "يحتفظ كل نشاط بوقته وموقعه ورقم هاتفه وخريطته وملاحظاتك الخاصة معًا — دون البحث في الرسائل الإلكترونية للعثور على التأكيد."
      - image: /assets/screenshots/journeyfolio/08-flights.png
        alt: "محرّر الرحلة الجوية يعرض مسارًا مُتحقَّقًا منه والأوقات وشركة الطيران"
        title: "رحلات جوية، مُتحقَّق منها ومُتتبَّعة"
        body: "أدخل رقم رحلة ويملأ Journeyfolio المسار والأوقات وشركة الطيران، ثم يُبقي حالتها المباشرة داخل مسارك بالتوقيت المحلي لكل مطار."

hi:
  showcase:
    label: "करीब से एक नज़र"
